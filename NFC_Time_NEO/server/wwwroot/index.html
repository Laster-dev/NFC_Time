<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 星野手作 | 客户实时时光看板 🐱</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=ZCOOL+KuaiLe&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .server-status-btn {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 9999px;
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #475569;
            transition: all 0.2s;
        }
        .server-status-btn:hover { background: #E2E8F0; }
        .status-online { background: #DCFCE7; color: #166534; border-color: #86EFAC; }
        .status-offline { background: #FEE2E2; color: #991B1B; border-color: #FCA5A5; }
        
        /* Cute Settings Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-card {
            background: #FFF; border-radius: 20px; padding: 22px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); border: 2px dashed #E6D2B8;
        }
        .modal-title { font-size: 1.1rem; font-weight: 900; color: #4A3E3D; margin-bottom: 12px; }
        .modal-input {
            width: 100%; padding: 10px 14px; border: 1.5px solid #CBD5E1; border-radius: 10px;
            font-size: 0.9rem; margin-bottom: 12px; outline: none; box-sizing: border-box;
        }
        .modal-input:focus { border-color: #0284C7; }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .m-btn { padding: 8px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; border: none; cursor: pointer; }
        .m-btn-cancel { background: #F1F5F9; color: #475569; }
        .m-btn-save { background: #0284C7; color: #FFF; }
    </style>
</head>
<body>
    <div class="workshop-container">
        <!-- Cute Craft Header -->
        <header class="craft-header">
            <div class="header-left">
                <span class="mascot-icon">🐱</span>
                <div>
                    <h1 class="shop-name">星野手作 · 实时时光</h1>
                    <p class="shop-slogan">✦ 智能手作计时与结算中心 ✦</p>
                </div>
            </div>
            <div class="header-right" style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span class="live-dot"></span>
                    <span id="liveClock" class="live-clock">--:--:--</span>
                </div>
                <button id="btnServerStatus" class="server-status-btn" onclick="openServerModal()">
                    <span id="serverStatusText">📡 连接中...</span>
                </button>
            </div>
        </header>

        <!-- Pricing Rules Bar -->
        <div class="pricing-rules-bar">
            <div class="rule-chip">✨ 智能豆板: ¥5/h (满1h后15分内免/半小时¥2.5/超30分¥5)</div>
            <div class="rule-chip">⏳ 游玩超时: 15min内免 · 半小时¥8 · 1小时¥15</div>
        </div>

        <!-- Filter Tabs -->
        <div class="tabs-pill-bar">
            <button class="tab-pill active" data-filter="all">全部 (<span id="countAll">0</span>)</button>
            <button class="tab-pill" data-filter="running">制作中 (<span id="countRunning">0</span>)</button>
            <button class="tab-pill" data-filter="postpay">⚠️ 玩完再付 (<span id="countPostpay">0</span>)</button>
            <button class="tab-pill" data-filter="douban">📟 智能豆板 (<span id="countDouban">0</span>)</button>
            <button class="tab-pill" data-filter="expired">🚨 已超时 (<span id="countExpired">0</span>)</button>
        </div>

        <!-- Card Grid List -->
        <div id="cardsGrid" class="card-grid">
            <div class="empty-cute-box">
                <div class="empty-mascot">🐾</div>
                <p>正在获取实时手作卡片数据...</p>
            </div>
        </div>

        <footer class="footer-stamp">
            <span>🐾 星野手作 · 温暖陪伴每一刻 🐾</span>
        </footer>
    </div>

    <!-- Server Settings Modal -->
    <div id="serverModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">⚙️ 配置服务端 API 地址</div>
            <p style="font-size: 0.8rem; color: #64748B; margin-bottom: 10px;">
                GitHub Pages 默认连接云端服务器，若更换 IP 或调试可在此修改：
            </p>
            <input type="text" id="modalApiInput" class="modal-input" placeholder="http://43.140.218.3:5000">
            <div style="display: flex; gap: 6px; margin-bottom: 14px;">
                <button class="m-btn" style="background:#E0F2FE; color:#0284C7; font-size:0.75rem; padding:4px 8px;" onclick="setModalUrl('http://43.140.218.3:5000')">云端服务器</button>
                <button class="m-btn" style="background:#E0F2FE; color:#0284C7; font-size:0.75rem; padding:4px 8px;" onclick="setModalUrl('http://127.0.0.1:5000')">本地服务器</button>
            </div>
            <div class="modal-btns">
                <button class="m-btn m-btn-cancel" onclick="closeServerModal()">取消</button>
                <button class="m-btn m-btn-save" onclick="saveServerModal()">保存并刷新</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
