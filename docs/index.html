<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 星野手作 | 计时工坊 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-hoshino: #fff5f8;
            --bg-card: #ffffff;
            --primary-pink: #ff6b8b;
            --primary-pink-soft: #ffeef2;
            --primary-pink-deep: #ff4772;
            
            --color-mint: #10b981;
            --color-mint-bg: #e6f9f0;
            --color-amber: #f59e0b;
            --color-amber-bg: #fffbeb;
            --color-rose: #f43f5e;
            --color-rose-bg: #fff1f2;
            --color-slate: #64748b;
            
            --text-title: #2d2327;
            --text-sub: #8c7a82;
            
            --shadow-kawaii: 0 4px 12px rgba(255, 107, 139, 0.1);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comfortaa', 'ZCOOL KuaiLe', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-hoshino);
            background-image: 
                radial-gradient(#ffd6e0 1.2px, transparent 1.2px),
                radial-gradient(#ffd6e0 1.2px, #fff5f8 1.2px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .hoshino-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Compact Header */
        .hoshino-header {
            background: #ffffff;
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-kawaii);
            border: 2px solid #ffdeee;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-avatar {
            font-size: 1.5rem;
        }

        .hoshino-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-pink-deep);
            line-height: 1.1;
        }

        .hoshino-sub {
            font-size: 0.65rem;
            color: var(--text-sub);
        }

        .counter-badge {
            background: var(--primary-pink-soft);
            color: var(--primary-pink-deep);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #ffccd8;
        }

        /* High-Density Dual Column Control Bar: Filter Tabs + Quick Summary */
        .control-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #ffffff;
            padding: 4px;
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            border: 1.5px solid #ffeef2;
        }

        .tabs-nav {
            display: flex;
            gap: 2px;
            flex: 1;
        }

        .tab-item {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-sub);
            padding: 6px 0;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-item.active {
            background: linear-gradient(135deg, #ff7597, #ff4772);
            color: #ffffff;
        }

        .quick-stats-strip {
            display: flex;
            gap: 6px;
            padding-right: 6px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .q-stat {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 2px 6px;
            border-radius: 8px;
        }

        .q-stat.q-run { background: var(--color-mint-bg); color: var(--color-mint); }
        .q-stat.q-expire { background: var(--color-rose-bg); color: var(--color-rose); }

        /* High-Density Dual-Column Cards Grid (2 Cards per Row) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-bottom: 20px;
        }

        .compact-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
            box-shadow: var(--shadow-card);
            border: 2px solid #ffedf2;
            position: relative;
            overflow: hidden;
        }

        .compact-card.card-expired-mode {
            border-color: #ffb3c1;
            background: linear-gradient(180deg, #ffffff 0%, #fff0f3 100%);
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-name {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--text-title);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .badge-mini {
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .badge-mint { background: var(--color-mint-bg); color: var(--color-mint); }
        .badge-amber { background: var(--color-amber-bg); color: var(--color-amber); }
        .badge-slate { background: #f1f5f9; color: var(--color-slate); }
        .badge-rose { background: var(--color-rose-bg); color: var(--color-rose); }

        .card-uid-micro {
            font-size: 0.65rem;
            font-family: monospace;
            color: #a1929a;
            margin-top: -4px;
        }

        .timer-center {
            text-align: center;
            padding: 2px 0;
        }

        .time-val-compact {
            font-size: 1.65rem;
            font-weight: 800;
            font-family: monospace;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .time-val-compact.text-mint { color: var(--color-mint); }
        .time-val-compact.text-amber { color: var(--color-amber); }
        .time-val-compact.text-rose { color: var(--color-rose); }

        .overdue-banner-compact {
            color: var(--color-rose);
            font-weight: 800;
            font-size: 0.72rem;
            margin-top: 2px;
        }

        /* High-Density Timeline Footer */
        .timeline-compact {
            background: #fff8fa;
            border-radius: 10px;
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-sub);
            border: 1px dashed #ffd6e0;
        }

        .tl-item {
            display: flex;
            flex-direction: column;
        }

        .tl-label {
            font-size: 0.6rem;
            color: #b09ba5;
            transform: scale(0.9);
            transform-origin: left center;
        }

        .tl-val {
            font-weight: 700;
            color: var(--text-title);
        }

        .progress-compact {
            height: 6px;
            background: #f1f5f9;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9ebb, #10b981);
            border-radius: 6px;
            transition: width 0.5s ease-out;
        }

        .empty-view {
            grid-column: span 2;
            text-align: center;
            padding: 40px 10px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            color: var(--text-sub);
            border: 2px dashed #ffd6e0;
        }

        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="hoshino-container">
        <!-- Compact Header -->
        <header class="hoshino-header">
            <div class="brand-group">
                <span class="brand-avatar">🌸</span>
                <div>
                    <h1 class="hoshino-title">星野手作</h1>
                    <p class="hoshino-sub">✦ 计时工坊 ✦</p>
                </div>
            </div>
            <div class="counter-badge">
                <span id="cardCounter">0 份手作</span>
            </div>
        </header>

        <!-- Compact Control Bar: Filter Tabs + Live Quick Stats -->
        <div class="control-bar">
            <nav class="tabs-nav">
                <button type="button" class="tab-item active" data-filter="all">✨ 全部</button>
                <button type="button" class="tab-item" data-filter="running">🌟 制作中</button>
                <button type="button" class="tab-item" data-filter="expired">🔔 时间到</button>
            </nav>

            <div class="quick-stats-strip">
                <div class="q-stat q-run">🏃 <span id="countRunning">0</span></div>
                <div class="q-stat q-expire">⏰ <span id="countExpired">0</span></div>
            </div>
        </div>

        <!-- High Density Dual Column Grid (2 Cards Per Row) -->
        <main class="card-grid" id="cardsGrid">
            <!-- Dynamic Compact Cards -->
        </main>
    </div>

    <script>
        let currentFilter = 'all';
        let cachedCardsData = [];

        const FIXED_GIST_ID = "6582c66b24bad75381f70abdae62e81b";
        const RAW_GIST_URL = `https://gist.githubusercontent.com/raw/${FIXED_GIST_ID}/cards_data.json`;

        document.addEventListener('DOMContentLoaded', () => {
            const tabItems = document.querySelectorAll('.tab-item');
            tabItems.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabItems.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentFilter = target.getAttribute('data-filter') || 'all';
                    renderDashboard(cachedCardsData);
                });
            });

            fetchCardsFromGist();
            
            // 1. Fetch remote data every 5 seconds
            setInterval(fetchCardsFromGist, 5000);

            // 2. Tick UI timer display every 1 second locally
            setInterval(tickLocalTimers, 1000);
        });

        async function fetchCardsFromGist() {
            try {
                const res = await fetch(`${RAW_GIST_URL}?t=${Date.now()}`);
                if (!res.ok) return;
                const fileContent = await res.text();

                if (fileContent) {
                    try {
                        cachedCardsData = JSON.parse(fileContent);
                    } catch (parseErr) {
                        cachedCardsData = [];
                    }
                    renderDashboard(cachedCardsData);
                }
            } catch (err) {
                console.error('Failed to fetch from Raw Gist CDN:', err);
            }
        }

        function tickLocalTimers() {
            if (cachedCardsData.length > 0) {
                renderDashboard(cachedCardsData);
            }
        }

        function computeCardsState(cards) {
            if (!Array.isArray(cards)) return [];
            const now = Date.now();

            return cards.map(c => {
                let remaining = c.savedRemainingSeconds || 0;
                let status = c.status; // 0: Stopped, 1: Running, 2: Paused, 3: Expired

                let startTimeStr = "--:--";
                let endTimeStr = "--:--";

                if (c.startTimeUtc) {
                    const startMs = new Date(c.startTimeUtc).getTime();
                    startTimeStr = formatClockTime(startMs);

                    if (c.targetDurationSeconds > 0) {
                        const endMs = startMs + (c.targetDurationSeconds * 1000);
                        endTimeStr = formatClockTime(endMs);
                    }

                    if (status === 1) {
                        const elapsed = (now - startMs) / 1000;
                        remaining = (c.savedRemainingSeconds || 0) - elapsed;
                        if (remaining <= 0) {
                            status = 3; // Expired
                        }
                    }
                }

                const isOverdue = remaining < 0 && (status === 1 || status === 3);
                const overdueSeconds = isOverdue ? Math.abs(remaining) : 0;

                return {
                    ...c,
                    status,
                    remainingSeconds: remaining,
                    overdueSeconds,
                    isOverdue,
                    startTimeStr,
                    endTimeStr
                };
            });
        }

        function formatClockTime(timestampMs) {
            if (!timestampMs || isNaN(timestampMs)) return "--:--";
            const date = new Date(timestampMs);
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function formatTime(totalSeconds) {
            const isNegative = totalSeconds < 0;
            const absSeconds = Math.abs(Math.floor(totalSeconds));
            
            const h = Math.floor(absSeconds / 3600);
            const m = Math.floor((absSeconds % 3600) / 60);
            const s = absSeconds % 60;

            const pad = n => n.toString().padStart(2, '0');
            let str = `${pad(m)}:${pad(s)}`;
            if (h > 0) str = `${pad(h)}:` + str;
            
            return isNegative ? `-${str}` : str;
        }

        function renderDashboard(rawCards) {
            const cards = computeCardsState(rawCards);

            let running = 0, expired = 0;
            cards.forEach(c => {
                if (c.isOverdue || c.status === 3) expired++;
                else if (c.status === 1) running++;
            });

            document.getElementById('cardCounter').textContent = `${cards.length} 份手作`;
            document.getElementById('countRunning').textContent = running;
            document.getElementById('countExpired').textContent = expired;

            const filtered = cards.filter(c => {
                if (currentFilter === 'running') return c.status === 1 && !c.isOverdue;
                if (currentFilter === 'expired') return c.isOverdue || c.status === 3;
                return true;
            });

            const grid = document.getElementById('cardsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-view">
                        <div class="empty-icon">🌸</div>
                        <p>暂无手作在制作中哦~<br>期待美好发生 ✨</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(card => {
                let isExpiredMode = card.isOverdue || card.status === 3;
                let badgeClass = 'badge-slate';
                let statusText = '准备中';
                let timeColorClass = '';

                if (isExpiredMode) {
                    badgeClass = 'badge-rose';
                    statusText = '时间到';
                    timeColorClass = 'text-rose';
                } else if (card.status === 1) {
                    badgeClass = 'badge-mint';
                    statusText = '制作中';
                    timeColorClass = 'text-mint';
                } else if (card.status === 2) {
                    badgeClass = 'badge-amber';
                    statusText = '憩息中';
                    timeColorClass = 'text-amber';
                }

                const remainingSec = card.remainingSeconds;
                const targetSec = card.targetDurationSeconds;
                let pct = 100;
                if (targetSec > 0) {
                    pct = Math.max(0, Math.min(100, (remainingSec / targetSec) * 100));
                }

                let timeHtml = '';
                if (isExpiredMode) {
                    timeHtml = `
                        <div class="time-val-compact text-rose">00:00</div>
                        <div class="overdue-banner-compact">超时: ${formatTime(card.overdueSeconds)}</div>
                    `;
                } else {
                    timeHtml = `
                        <div class="time-val-compact ${timeColorClass}">
                            ${formatTime(remainingSec)}
                        </div>
                    `;
                }

                return `
                    <div class="compact-card ${isExpiredMode ? 'card-expired-mode' : ''}">
                        <div>
                            <div class="card-head">
                                <div class="card-name" title="${escapeHtml(card.name)}">${escapeHtml(card.name)}</div>
                                <span class="badge-mini ${badgeClass}">${statusText}</span>
                            </div>
                            <div class="card-uid-micro">UID: ${escapeHtml(card.cardId)}</div>
                        </div>

                        <div class="timer-center">
                            ${timeHtml}
                        </div>

                        <!-- Compact Timeline -->
                        <div class="timeline-compact">
                            <div class="tl-item">
                                <span class="tl-label">开始</span>
                                <span class="tl-val">${card.startTimeStr}</span>
                            </div>
                            <div class="tl-item" style="text-align: right;">
                                <span class="tl-label">到期</span>
                                <span class="tl-val">${card.endTimeStr}</span>
                            </div>
                        </div>

                        <div class="progress-compact">
                            <div class="progress-fill" style="width: ${isExpiredMode ? 0 : pct}%; ${card.status === 2 ? 'background: #f59e0b' : ''}"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
