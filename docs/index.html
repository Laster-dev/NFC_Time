<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 星野手作 | 萌趣时光小屋 🐱</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=ZCOOL+KuaiLe&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Warm Creamy Craft Palette */
            --bg-page: #FFFDF9;
            --bg-card: #FFFFFF;
            --border-craft: #F4E8D6;
            --border-dashed: #E6D2B8;
            
            --text-dark: #4A3E3D;
            --text-sub: #9E8E8C;
            
            --color-cream-yellow: #FEF3C7;
            --color-cream-yellow-border: #FCD34D;
            --color-yellow-text: #D97706;
            
            --color-mint-soft: #D1FAE5;
            --color-mint-border: #6EE7B7;
            --color-mint-text: #059669;
            
            --color-rose-soft: #FFE4E6;
            --color-rose-border: #FDA4AF;
            --color-rose-text: #E11D48;

            --color-blue-soft: #E0F2FE;
            --color-blue-text: #0284C7;
            
            --shadow-kawaii: 0 6px 16px rgba(158, 142, 140, 0.08);
            --shadow-hover: 0 10px 24px rgba(158, 142, 140, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Ultra-Cute Round Fonts */
            font-family: 'M PLUS Rounded 1c', 'Comfortaa', 'ZCOOL KuaiLe', system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(#F3E5D8 1.5px, transparent 1.5px),
                radial-gradient(#F3E5D8 1.5px, #FFFDF9 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .kawaii-workshop {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Handmade Craft Header */
        .craft-header {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-kawaii);
            border: 2px dashed var(--border-dashed);
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mascot-icon {
            font-size: 2.2rem;
            animation: cute-wobble 3s ease-in-out infinite;
        }

        @keyframes cute-wobble {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg) scale(1.08); }
        }

        .shop-name {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-dark);
            line-height: 1.1;
            font-family: 'M PLUS Rounded 1c', 'ZCOOL KuaiLe', sans-serif;
        }

        .shop-slogan {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-top: 3px;
        }

        .hand-badge {
            background: var(--color-cream-yellow);
            border: 2px solid var(--color-cream-yellow-border);
            color: var(--color-yellow-text);
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        /* Announcement Section in Web (Normal non-force list) */
        .anno-board-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .anno-cute-card {
            background: #FFFFFF;
            border-radius: 10px;
            padding: 8px 12px;
            border: 1.5px solid #FCD34D;
            background: linear-gradient(180deg, #FFFFFF 0%, #FEFCE8 100%);
            box-shadow: var(--shadow-kawaii);
            position: relative;
        }

        .anno-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .anno-card-title {
            font-size: 0.95rem;
            font-weight: 900;
            color: #D97706;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .anno-card-time {
            font-size: 0.65rem;
            color: #9E8E8C;
            font-family: 'Comfortaa', sans-serif;
        }

        .anno-card-content {
            font-size: 0.82rem;
            color: var(--text-dark);
            line-height: 1.4;
            white-space: pre-wrap;
        }

        /* Forced Announcement Modal Overlay */
        .force-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(45, 35, 39, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .force-modal-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 360px;
            border-radius: 26px;
            padding: 22px 20px;
            border: 4px solid #FDA4AF;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
            animation: modal-bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modal-bounce {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .force-modal-header {
            font-size: 1.2rem;
            font-weight: 900;
            color: #E11D48;
        }

        .force-modal-body {
            font-size: 0.92rem;
            color: var(--text-dark);
            line-height: 1.5;
            background: #FFF1F2;
            padding: 14px;
            border-radius: 16px;
            border: 2px dashed #FECDD3;
            text-align: left;
            white-space: pre-wrap;
        }

        .force-close-btn {
            background: #E11D48;
            color: #FFFFFF;
            border: none;
            outline: none;
            padding: 12px 0;
            border-radius: 18px;
            font-size: 0.95rem;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
            transition: all 0.2s;
        }

        .force-close-btn:disabled {
            background: #9CA3AF;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Cute Tabs Filter */
        .tabs-pill-bar {
            display: flex;
            background: #FFFFFF;
            padding: 4px;
            border-radius: 10px;
            box-shadow: var(--shadow-kawaii);
            border: 2px solid var(--border-craft);
            gap: 4px;
        }

        .tab-pill {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-sub);
            padding: 6px 0;
            font-size: 0.82rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .tab-pill.active {
            background: #FFE4E6;
            color: #E11D48;
            border: 1.5px solid #FDA4AF;
            font-weight: 900;
        }

        /* Single Column Hand-crafted Card Grid */
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 30px;
        }

        .cute-card {
            background: #FFFFFF;
            border-radius: 22px;
            padding: 14px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            box-shadow: var(--shadow-kawaii);
            border: 3px solid var(--border-craft);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cute-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .cute-card.card-overdue-mode {
            border-color: var(--color-rose-border);
            background: linear-gradient(180deg, #FFFFFF 0%, #FFF5F5 100%);
            animation: soft-pulse 2s infinite alternate;
        }

        @keyframes soft-pulse {
            0% { border-color: #FDA4AF; }
            100% { border-color: #F43F5E; }
        }

        .card-head-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-name-title {
            font-size: 1.08rem;
            font-weight: 800;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }

        .cute-tag {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 800;
            border: 1.5px solid transparent;
        }

        .tag-mint { background: var(--color-mint-soft); border-color: var(--color-mint-border); color: var(--color-mint-text); }
        .tag-amber { background: var(--color-cream-yellow); border-color: var(--color-cream-yellow-border); color: var(--color-yellow-text); }
        .tag-gray { background: #F3F4F6; border-color: #E5E7EB; color: #6B7280; }
        .tag-rose { background: var(--color-rose-soft); border-color: var(--color-rose-border); color: var(--color-rose-text); }

        .card-uid-sub {
            font-size: 0.68rem;
            color: var(--text-sub);
            margin-top: 1px;
            font-family: 'Comfortaa', monospace;
            font-weight: 700;
        }

        .card-row-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-row-2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .clock-val-cute {
            font-size: 1.32rem;
            font-family: 'M PLUS Rounded 1c', 'Comfortaa', sans-serif;
            font-weight: 800;
            letter-spacing: -0.4px;
            line-height: 1.1;
            white-space: nowrap;
            display: inline-block;
        }

        .clock-val-cute.text-mint { color: var(--color-mint-text); }
        .clock-val-cute.text-amber { color: var(--color-yellow-text); }
        .clock-val-cute.text-rose { color: var(--color-rose-text); }

        .overdue-mini-alert {
            color: var(--color-rose-text);
            background: var(--color-rose-soft);
            border: 1px solid var(--color-rose-border);
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .progress-candy-bg {
            height: 3px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 1.5px;
            overflow: hidden;
            margin-top: 8px;
            margin-bottom: 2px;
        }

        .progress-candy-fill {
            height: 100%;
            background: #10B981;
            border-radius: 1.5px;
            transition: width 0.5s ease-out;
        }

        .empty-cute-box {
            grid-column: span 2;
            text-align: center;
            padding: 50px 10px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: var(--shadow-kawaii);
            border: 3px dashed var(--border-dashed);
            color: var(--text-sub);
        }

        .empty-mascot {
            font-size: 3rem;
            margin-bottom: 8px;
        }

        /* Telegram Styled Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            height: 60px;
            background: rgba(255, 253, 249, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 2px solid var(--border-craft);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 -4px 16px rgba(158, 142, 140, 0.06);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .nav-item {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .nav-item-icon {
            font-size: 1.25rem;
            transition: transform 0.2s;
        }

        .nav-item-text {
            font-size: 0.72rem;
            font-weight: 800;
        }

        .nav-item.active {
            color: #E11D48;
        }

        .nav-item.active .nav-item-icon {
            transform: scale(1.15) translateY(-1px);
        }

        .tab-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .alarm-btn {
            background: #FFE4E6;
            border: 1px solid #FDA4AF;
            color: #E11D48;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            line-height: 1;
            margin-left: 6px;
        }

        .alarm-btn:hover {
            background: #FECDD3;
            transform: scale(1.05);
        }

        .alarm-btn:active {
            transform: scale(0.95);
        }

        /* Music Form Styles */
        .music-card {
            background: #FFFFFF;
            border-radius: 12px;
            border: 2px solid var(--border-craft);
            box-shadow: var(--shadow-kawaii);
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .music-head {
            text-align: center;
            border-bottom: 1.5px dashed var(--border-dashed);
            padding-bottom: 8px;
        }

        .music-head-title {
            font-size: 1.12rem;
            font-weight: 900;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .music-head-subtitle {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 2px;
            font-weight: 700;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-label-req {
            color: #E11D48;
            font-size: 0.72rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: #FDFBF7;
            border: 1.5px solid var(--border-craft);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.82rem;
            font-family: inherit;
            color: var(--text-dark);
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #FDA4AF;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(253, 164, 175, 0.2);
        }

        .quick-tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 2px;
        }

        .quick-tag-pill {
            background: #FEF3C7;
            border: 1px solid #FCD34D;
            color: #D97706;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .quick-tag-pill:hover {
            background: #FDE68A;
            transform: scale(1.04);
        }

        .music-submit-btn {
            background: linear-gradient(135deg, #FF6B8B, #FF8E9F);
            border: none;
            color: #FFFFFF;
            font-size: 0.92rem;
            font-weight: 900;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 139, 0.25);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
            font-family: inherit;
        }

        .music-submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 107, 139, 0.35);
        }

        .music-submit-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .music-submit-btn:disabled {
            background: #D1D5DB;
            box-shadow: none;
            cursor: not-allowed;
            color: #9CA3AF;
        }

        .music-tip-box {
            background: #F0FDF4;
            border: 1px dashed #86EFAC;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.72rem;
            color: #15803D;
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .music-feedback-toast {
            display: none;
            background: #FFF1F2;
            border: 1.5px solid #FDA4AF;
            border-radius: 8px;
            padding: 10px 12px;
            color: #BE123C;
            font-size: 0.8rem;
            font-weight: 800;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        /* NetEase Search & Playlist Styles */
        .music-search-bar-wrap {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .music-search-input {
            flex: 1;
            background: #FDFBF7;
            border: 1.5px solid var(--border-craft);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.8rem;
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .music-search-input:focus {
            border-color: #FDA4AF;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(253, 164, 175, 0.2);
        }

        .music-search-btn {
            background: #FFE4E6;
            border: 1.5px solid #FDA4AF;
            color: #E11D48;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }

        .music-search-btn:hover {
            background: #FECDD3;
            transform: scale(1.03);
        }

        .music-playlist-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 4px;
        }

        .playlist-pill {
            background: #EFF6FF;
            border: 1px solid #BFDBFE;
            color: #2563EB;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .playlist-pill:hover, .playlist-pill.active {
            background: #DBEAFE;
            border-color: #93C5FD;
            transform: scale(1.04);
        }

        .music-list-wrap {
            max-height: 220px;
            overflow-y: auto;
            border: 1.5px solid var(--border-craft);
            border-radius: 10px;
            background: #FFFDF9;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        .music-list-wrap::-webkit-scrollbar {
            width: 4px;
        }
        .music-list-wrap::-webkit-scrollbar-thumb {
            background: #FDA4AF;
            border-radius: 4px;
        }

        .music-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 8px;
            background: #FFFFFF;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.2s;
        }

        .music-item-row:hover {
            background: #FFF5F5;
            border-color: #FECDD3;
        }

        .music-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            flex: 1;
        }

        .music-item-pic {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            object-fit: cover;
            background: #FFE4E6;
            flex-shrink: 0;
        }

        .music-item-meta {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            gap: 1px;
        }

        .music-item-name {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-item-artist {
            font-size: 0.68rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-pick-btn {
            background: #FFF1F2;
            border: 1px solid #FDA4AF;
            color: #E11D48;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .music-pick-btn:hover {
            background: #FF6B8B;
            color: #FFFFFF;
            border-color: #FF6B8B;
            transform: scale(1.05);
        }

        .selected-song-banner {
            background: #FFF1F2;
            border: 1.5px solid #FDA4AF;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .selected-song-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .selected-song-title {
            font-size: 0.82rem;
            font-weight: 900;
            color: #BE123C;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selected-song-artist {
            font-size: 0.7rem;
            color: #E11D48;
        }
    </style>
</head>
<body>
    <div class="kawaii-workshop" style="padding-bottom: 75px;">
        <!-- Craft Header -->
        <header class="craft-header">
            <div class="header-left">
                <span class="mascot-icon">🐱</span>
                <div>
                    <h1 class="shop-name">星野手作</h1>
                    <p class="shop-slogan">✦ 萌趣时光小屋 ✦</p>
                </div>
            </div>
            <div class="hand-badge" id="cardCounter">0 份手作</div>
        </header>

        <!-- Section 1: Timer Content -->
        <section id="sec-timer" class="tab-section">
            <!-- Announcement Board Container -->
            <div class="anno-board-area" id="annoBoardArea">
                <!-- Dynamic announcements -->
            </div>

            <!-- Cute Filter Tabs -->
            <nav class="tabs-pill-bar">
                <button type="button" class="tab-pill active" data-filter="all">✨ 全部手作</button>
                <button type="button" class="tab-pill" data-filter="running">🏃 制作中</button>
                <button type="button" class="tab-pill" data-filter="expired">⏰ 时间到啦</button>
            </nav>

            <!-- Dual Column Cards Grid -->
            <main class="card-grid" id="cardsGrid">
                <!-- Dynamic Cute Cards -->
            </main>
        </section>

        <!-- Section 2: Song Content -->
        <section id="sec-music" class="tab-section" style="display: none;">
            <div class="music-card">
                <div class="music-head">
                    <div class="music-head-title">
                        <span>🎵</span>
                        <span>星野萌趣点歌台</span>
                        <span>🐱</span>
                    </div>
                    <p class="music-head-subtitle">连接网易云曲库 · 选一首心仪的旋律陪伴手作时光</p>
                </div>

                <div id="musicToast" class="music-feedback-toast"></div>

                <!-- NetEase Search / Playlist Input -->
                <div class="form-group">
                    <label class="form-label" for="musicSearchInput">
                        <span>🔍 网易云曲库搜索 / 歌单导入</span>
                    </label>
                    <div class="music-search-bar-wrap">
                        <input type="text" id="musicSearchInput" class="music-search-input" placeholder="输入歌名/歌手，或粘贴网易云歌单链接/ID" onkeydown="if(event.key==='Enter') searchNetEaseMusic()" />
                        <button type="button" class="music-search-btn" onclick="searchNetEaseMusic()">🔍 搜索/导入</button>
                    </div>
                </div>

                <!-- Preset Playlists -->
                <div class="form-group">
                    <label class="form-label">✨ 精选网易云歌单推荐：</label>
                    <div class="music-playlist-pills">
                        <span class="playlist-pill active" id="pill-3778678" onclick="loadNetEasePlaylist('3778678', this)">🔥 热歌榜</span>
                        <span class="playlist-pill" id="pill-2829883282" onclick="loadNetEasePlaylist('2829883282', this)">☕ 治愈手作慢调</span>
                        <span class="playlist-pill" id="pill-505964270" onclick="loadNetEasePlaylist('505964270', this)">🌻 宫崎骏原声</span>
                        <span class="playlist-pill" id="pill-3779629" onclick="loadNetEasePlaylist('3779629', this)">🌸 经典暖心榜</span>
                    </div>
                </div>

                <!-- Song Selection List -->
                <div class="form-group">
                    <label class="form-label" id="musicListLabel">📜 网易云推荐曲目 (点击即可一键点歌)：</label>
                    <div class="music-list-wrap" id="musicSearchResultArea">
                        <div style="text-align: center; padding: 20px; color: var(--text-sub); font-size: 0.78rem;">
                            <span>⏳ 正在加载网易云热歌榜...</span>
                        </div>
                    </div>
                </div>

                <!-- Selected Song Indicator & Quick Submit -->
                <div id="selectedSongBox" style="display: none;">
                    <div class="selected-song-banner">
                        <div class="selected-song-info">
                            <div class="selected-song-title" id="dispSelectedSong">🎵 已选歌曲：--</div>
                            <div class="selected-song-artist" id="dispSelectedArtist">🎤 歌手：--</div>
                        </div>
                        <button type="button" id="btnSubmitSong" class="music-submit-btn" style="margin-top: 0; padding: 6px 14px; font-size: 0.8rem;" onclick="submitSongRequest()">
                            <span id="btnSubmitSongText">立即点歌 🐾</span>
                        </button>
                    </div>
                </div>

                <!-- Hidden inputs holding selected song -->
                <input type="hidden" id="musicSongId" />
                <input type="hidden" id="musicSongName" />
                <input type="hidden" id="musicArtist" />

                <!-- Tip Box -->
                <div class="music-tip-box">
                    <span>💡</span>
                    <span>点歌须知：新点的歌曲会自动加入播放队列，当前歌曲播放完毕后将依次为您播放~</span>
                </div>
            </div>
        </section>

        <!-- Section 3: LED Content -->
        <section id="sec-led" class="tab-section" style="display: none;">
            <div class="led-download-card" style="text-align: center; padding: 30px 20px; background: #FFFFFF; border-radius: 12px; border: 2.5px dashed var(--border-dashed); margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
                <div style="font-size: 3rem; animation: cute-wobble 3s ease-in-out infinite; display: inline-block;">📟</div>
                <h2 style="font-weight: 800; font-size: 1.15rem; color: var(--text-dark);">智能豆板 App</h2>
                <p style="font-size: 0.8rem; color: var(--text-sub); line-height: 1.5; max-width: 280px; margin-bottom: 6px;">
                    扫描下方二维码下载「智能豆板」App，随时随地开启你的智能设备之旅！
                </p>
                
                <!-- QR Code wrapper with soft shadow and clean border -->
                <div style="background: #FFFFFF; padding: 10px; border-radius: 12px; border: 2px solid var(--border-craft); box-shadow: var(--shadow-kawaii); width: 176px; height: 176px; display: flex; justify-content: center; align-items: center;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=156x156&data=https%3A%2F%2Fapp.iledshow.cn%2Fappversion%2Fdownload%3Fpackage%3Dcom.led.pixdou" alt="智能豆板下载二维码" style="width: 156px; height: 156px; display: block; border-radius: 6px;" />
                </div>

                <!-- Direct Download link button -->
                <a href="https://app.iledshow.cn/appversion/download?package=com.led.pixdou" target="_blank" style="text-decoration: none; background: #FFE4E6; border: 2px solid #FDA4AF; color: #E11D48; padding: 8px 20px; border-radius: 14px; font-size: 0.85rem; font-weight: 800; box-shadow: var(--shadow-kawaii); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                    📥 直接点击下载
                </a>
            </div>
        </section>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item active" onclick="switchTab('sec-timer', this)">
                <span class="nav-item-icon">⏱️</span>
                <span class="nav-item-text">计时</span>
            </button>
            <button type="button" class="nav-item" onclick="switchTab('sec-music', this)">
                <span class="nav-item-icon">🎵</span>
                <span class="nav-item-text">点歌</span>
            </button>
            <button type="button" class="nav-item" onclick="switchTab('sec-led', this)">
                <span class="nav-item-icon">📟</span>
                <span class="nav-item-text">智能豆板</span>
            </button>
        </nav>
    </div>

    <!-- Forced Announcement Modal -->
    <div class="force-modal-overlay" id="forceAnnoModal" style="display: none;">
        <div class="force-modal-box">
            <div class="force-modal-header" id="forceModalTitle">📢 重要公告</div>
            <div class="force-modal-body" id="forceModalContent">...</div>
            <button type="button" class="force-close-btn" id="forceCloseBtn" disabled>阅读倒计时 (3s)</button>
        </div>
    </div>

    <script>
        function switchTab(tabId, clickedBtn) {
            // Hide all tab sections
            document.querySelectorAll('.tab-section').forEach(sec => {
                sec.style.display = 'none';
            });
            // Show target section
            document.getElementById(tabId).style.display = 'flex';

            // Update bottom nav active state
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            clickedBtn.classList.add('active');
        }

        function parseUtcDate(utcStr) {
            if (!utcStr) return null;
            let d = new Date(utcStr);
            if (!isNaN(d.getTime())) return d.getTime();
            try {
                let clean = utcStr.replace('T', ' ').replace('Z', ' UTC');
                d = new Date(clean);
                if (!isNaN(d.getTime())) return d.getTime();
            } catch (e) {}
            return null;
        }

        function addSystemAlarm(endMs, cardName) {
            const ua = navigator.userAgent.toLowerCase();
            const isAndroid = ua.indexOf('android') > -1;
            const isIos = /ipad|iphone|ipod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isWeChat = ua.indexOf('micromessenger') > -1;

            if (isWeChat) {
                alert('💬 微信限制：\n由于微信内置浏览器的安全屏蔽，直接点击网页无法唤起外部应用。请点击右上角「···」选择「在浏览器中打开」，即可正常一键添加闹钟预设哦！');
                return;
            }

            if (isAndroid) {
                if (!endMs || isNaN(endMs)) {
                    alert('无法获取该卡片的到期时间，无法设置闹钟。');
                    return;
                }
                const date = new Date(endMs);
                const hour = date.getHours();
                const minutes = date.getMinutes();
                
                // Construct standard Android Intent URI with intent:// scheme, end marker and correct types
                const intentUri = `intent://#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${hour};i.android.intent.extra.alarm.MINUTES=${minutes};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(cardName + '到期提醒')};B.android.intent.extra.alarm.SKIP_UI=false;end`;
                
                try {
                    window.location.href = intentUri;
                } catch (e) {
                    alert('唤起系统闹钟失败，请手动在手机中设置。');
                }
            } else if (isIos) {
                alert('🍎 苹果系统限制：\niOS 系统出于安全沙盒保护，不支持网页端直接拉起时钟添加闹钟，请您手动在系统【时钟】应用中预设闹钟提醒哦。');
            } else {
                alert('提示：当前平台不支持网页端直接拉起时钟，仅支持在安卓手机端拉起系统闹钟，请您手动在系统时钟中添加提醒。');
            }
        }

        let currentFilter = 'all';
        let cachedCardsData = [];
        let cachedAnnouncements = [];
        let forceShownMap = new Set();

        const FIXED_GIST_ID = "6582c66b24bad75381f70abdae62e81b";
        
        // Pure CDN URLs
        const RAW_GIST_CARDS = `https://gist.githubusercontent.com/raw/${FIXED_GIST_ID}/cards_data.json`;
        const RAW_GIST_ANNOS = `https://gist.githubusercontent.com/raw/${FIXED_GIST_ID}/announcements.json`;

        document.addEventListener('DOMContentLoaded', () => {
            const tabPills = document.querySelectorAll('.tab-pill');
            tabPills.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabPills.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentFilter = target.getAttribute('data-filter') || 'all';
                    renderDashboard(cachedCardsData);
                });
            });

            fetchAllFromCDN();
            setInterval(fetchAllFromCDN, 4000);  // Poll Raw CDN every 4s
            setInterval(tickLocalTimers, 1000);   // Tick UI timer every 1s
        });

        async function fetchAllFromCDN() {
            try {
                const [cardsRes, annosRes] = await Promise.all([
                    fetch(`${RAW_GIST_CARDS}?t=${Date.now()}`).catch(() => null),
                    fetch(`${RAW_GIST_ANNOS}?t=${Date.now()}`).catch(() => null)
                ]);

                if (cardsRes && cardsRes.ok) {
                    const cardsText = await cardsRes.text();
                    if (cardsText) {
                        try { cachedCardsData = JSON.parse(cardsText); } catch (e) {}
                    }
                    renderDashboard(cachedCardsData);
                }

                if (annosRes && annosRes.ok) {
                    const annosText = await annosRes.text();
                    if (annosText) {
                        try { cachedAnnouncements = JSON.parse(annosText); } catch (e) {}
                    }
                    renderAnnouncements(cachedAnnouncements);
                }
            } catch (err) {
                console.error('Failed to fetch CDN data:', err);
            }
        }

        function renderAnnouncements(annos) {
            if (!Array.isArray(annos) || annos.length === 0) {
                document.getElementById('annoBoardArea').innerHTML = '';
                return;
            }

            const forcedAnnos = annos.filter(a => a.isForce);

            // Render ALL announcements on board
            const board = document.getElementById('annoBoardArea');
            board.innerHTML = annos.map(a => `
                <div class="anno-cute-card">
                    <div class="anno-card-head">
                        <span class="anno-card-title">${a.isForce ? '🚨 [重要提醒]' : '📢'} ${escapeHtml(a.title)}</span>
                        <span class="anno-card-time">${formatAnnoTime(a.publishTimeUtc)}</span>
                    </div>
                    <div class="anno-card-content">${escapeHtml(a.content)}</div>
                </div>
            `).join('');

            // Handle forced popup (Show latest forced announcement if not popped yet)
            if (forcedAnnos.length > 0) {
                const latestForce = forcedAnnos[0];
                if (!forceShownMap.has(latestForce.id)) {
                    showForceModal(latestForce);
                }
            }
        }

        function showForceModal(anno) {
            forceShownMap.add(anno.id);
            const modal = document.getElementById('forceAnnoModal');
            const titleEl = document.getElementById('forceModalTitle');
            const contentEl = document.getElementById('forceModalContent');
            const btn = document.getElementById('forceCloseBtn');

            titleEl.textContent = `📢 ${anno.title}`;
            contentEl.textContent = anno.content;
            btn.disabled = true;

            modal.style.display = 'flex';

            let count = 3;
            btn.textContent = `阅读倒计时 (${count}s)`;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    btn.textContent = `阅读倒计时 (${count}s)`;
                } else {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = `知晓并关闭`;
                    btn.onclick = () => {
                        modal.style.display = 'none';
                    };
                }
            }, 1000);
        }

        function formatAnnoTime(utcStr) {
            if (!utcStr) return '';
            const date = new Date(utcStr);
            if (isNaN(date.getTime())) return utcStr;
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function tickLocalTimers() {
            if (cachedCardsData.length > 0) {
                renderDashboard(cachedCardsData);
            }
        }

        function computeCardsState(cards) {
            if (!Array.isArray(cards)) return [];
            const now = Date.now();

            return cards.map(c => {
                let remaining = c.savedRemainingSeconds || 0;
                let status = c.status; // 0: Unused/Stopped, 1: Running, 2: Paused, 3: Expired

                let startTimeStr = "--:--";
                let endTimeStr = "--:--";

                if (c.startTimeUtc) {
                    const startMs = new Date(c.startTimeUtc).getTime();
                    startTimeStr = formatClockTime(startMs);

                    if (c.targetDurationSeconds > 0) {
                        const endMs = startMs + (c.targetDurationSeconds * 1000);
                        endTimeStr = formatClockTime(endMs);
                    }

                    if (status === 1) {
                        const elapsed = (now - startMs) / 1000;
                        remaining = (c.savedRemainingSeconds || 0) - elapsed;
                        if (remaining <= 0) {
                            status = 3; // Expired
                        }
                    }
                }

                const isOverdue = remaining < 0 && (status === 1 || status === 3);
                const overdueSeconds = isOverdue ? Math.abs(remaining) : 0;

                return {
                    ...c,
                    status,
                    remainingSeconds: remaining,
                    overdueSeconds,
                    isOverdue,
                    startTimeStr,
                    endTimeStr
                };
            });
        }

        function formatClockTime(timestampMs) {
            if (!timestampMs || isNaN(timestampMs)) return "--:--";
            const date = new Date(timestampMs);
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function formatTime(totalSeconds) {
            const isNegative = totalSeconds < 0;
            const absSeconds = Math.abs(Math.floor(totalSeconds));
            
            const h = Math.floor(absSeconds / 3600);
            const m = Math.floor((absSeconds % 3600) / 60);
            const s = absSeconds % 60;

            let parts = [];
            if (h > 0) parts.push(`${h}小时`);
            if (m > 0 || h > 0) parts.push(`${m}分钟`);
            parts.push(`${s}秒`);
            let str = parts.join('');
            
            return isNegative ? `-${str}` : str;
        }

        function renderDashboard(rawCards) {
            const allCards = computeCardsState(rawCards);

            // Filter out status === 0 (Unused cards) from Web display
            const activeWebCards = allCards.filter(c => c.status !== 0);

            document.getElementById('cardCounter').textContent = `${activeWebCards.length} 份手作`;

            const filtered = activeWebCards.filter(c => {
                if (currentFilter === 'running') return c.status === 1 && !c.isOverdue;
                if (currentFilter === 'expired') return c.isOverdue || c.status === 3;
                return true;
            });

            // Sort: Overdue cards first!
            filtered.sort((a, b) => {
                const aOverdue = a.isOverdue || a.status === 3;
                const bOverdue = b.isOverdue || b.status === 3;
                if (aOverdue && !bOverdue) return -1;
                if (!aOverdue && bOverdue) return 1;
                if (a.status === 1 && b.status !== 1) return -1;
                if (a.status !== 1 && b.status === 1) return 1;
                return a.cardId.localeCompare(b.cardId);
            });

            const grid = document.getElementById('cardsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-cute-box">
                        <div class="empty-mascot">🐾</div>
                        <p>暂无制作中的手作哦~<br>快去手机端刷卡开始吧！✨</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(card => {
                let isExpiredMode = card.isOverdue || card.status === 3;
                let tagClass = 'tag-gray';
                let statusText = '🌸 准备中';
                let timeColorClass = '';

                if (isExpiredMode) {
                    tagClass = 'tag-rose';
                    statusText = '⏰ 时间到';
                    timeColorClass = 'text-rose';
                } else if (card.status === 1) {
                    tagClass = 'tag-mint';
                    statusText = '🏃 制作中';
                    timeColorClass = 'text-mint';
                } else if (card.status === 2) {
                    tagClass = 'tag-amber';
                    statusText = '🍵 憩息中';
                    timeColorClass = 'text-amber';
                }

                const remainingSec = card.remainingSeconds;
                const targetSec = card.targetDurationSeconds;
                let pct = 100;
                if (targetSec > 0) {
                    pct = Math.max(0, Math.min(100, (remainingSec / targetSec) * 100));
                }

                return `
                    <div class="cute-card ${isExpiredMode ? 'card-overdue-mode' : ''}">
                        <!-- Row 1: Title + Tag on Left, Timer on Right -->
                        <div class="card-row-1">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="card-name-title" title="${escapeHtml(card.name)}">${escapeHtml(card.name)}</span>
                                <span class="cute-tag ${tagClass}">${statusText}</span>
                            </div>
                            <div class="clock-val-cute ${timeColorClass}">
                                ${isExpiredMode ? '0秒' : formatTime(remainingSec)}
                            </div>
                        </div>

                        <!-- Row 2: Timestamps, Overdue Mini Alert & Alarm Button -->
                        <div class="card-row-2" style="justify-content: flex-start; gap: 8px;">
                            <span class="stamp-val-text">${card.startTimeStr} → ${card.endTimeStr}</span>
                            ${isExpiredMode ? `<span class="overdue-mini-alert">🚨 超时 ${formatTime(card.overdueSeconds)}</span>` : ''}
                            ${card.status === 1 && card.startTimeUtc ? `
                                <button type="button" class="alarm-btn" onclick="addSystemAlarm(parseUtcDate('${card.startTimeUtc}') + (${card.targetDurationSeconds * 1000}), '${escapeHtml(card.name)}')">⏰ 设闹钟</button>
                            ` : ''}
                        </div>

                        <!-- Progress Bar at bottom -->
                        <div class="progress-candy-bg">
                            <div class="progress-candy-fill" style="width: ${isExpiredMode ? 0 : pct}%; ${card.status === 2 ? 'background: #FCD34D' : ''}"></div>
                        </div>
                    </div>
                `;
            }).join('');

            // Dynamically adjust font size to prevent overflow or wrapping
            document.querySelectorAll('.clock-val-cute').forEach(el => {
                adjustFontSize(el);
            });
        }

        function adjustFontSize(element) {
            let fontSize = 1.32; // Start size in rem (aligned with CSS)
            element.style.fontSize = fontSize + 'rem';
            const parent = element.parentElement;
            if (!parent) return;
            const maxAllowedWidth = parent.clientWidth - 12; // 6px safety padding on each side
            while (element.scrollWidth > maxAllowedWidth && fontSize > 0.7) {
                fontSize -= 0.05;
                element.style.fontSize = fontSize.toFixed(2) + 'rem';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // NetEase Music Integration
        let currentLoadedSongs = [];

        const METING_MIRRORS = [
            // 1. 高速主力 Meting 镜像源 (Xiaoguan)
            (type, id) => `https://met.api.xiaoguan.fit/api?server=netease&type=${type}&id=${encodeURIComponent(id)}`,
            // 2. 稳定公用 Meting 镜像源 (Liiiu)
            (type, id) => `https://met.liiiu.cn/meting/api?server=netease&type=${type}&id=${encodeURIComponent(id)}`,
            // 3. 备用 Meting 镜像源 (243542)
            (type, id) => `https://meting-api.243542.xyz/api?server=netease&type=${type}&id=${encodeURIComponent(id)}`,
            // 4. 老牌 Meting 节点 (Injahow)
            (type, id) => `https://api.injahow.cn/meting/?type=${type}&id=${encodeURIComponent(id)}`,
            // 5. 老牌 Meting 节点备用路由 (Injahow Server Mode)
            (type, id) => `https://api.injahow.cn/meting/?server=netease&type=${type}&id=${encodeURIComponent(id)}`,
            // 6. 官方衍生公用节点 (I-Meto)
            (type, id) => `https://api.i-meto.com/meting/api?server=netease&type=${type}&id=${encodeURIComponent(id)}`,
            // 7. 社区 Meting 节点 (XF1433)
            (type, id) => `https://music.xf1433.com/api/?server=netease&type=${type}&id=${encodeURIComponent(id)}`,
            // 8. 网易云直通代理 1 (AllOrigins Raw)
            (type, id) => `https://api.allorigins.win/raw?url=${encodeURIComponent(type === 'playlist' ? `https://music.163.com/api/v1/playlist/detail?id=${id}` : (type === 'search' ? `https://music.163.com/api/search/get/web?s=${encodeURIComponent(id)}&type=1&offset=0&total=true&limit=20` : `https://music.163.com/api/song/detail/?id=${id}&ids=[${id}]`))}`,
            // 9. 网易云直通代理 2 (CodeTabs Proxy)
            (type, id) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(type === 'playlist' ? `https://music.163.com/api/v1/playlist/detail?id=${id}` : (type === 'search' ? `https://music.163.com/api/search/get/web?s=${encodeURIComponent(id)}&type=1&offset=0&total=true&limit=20` : `https://music.163.com/api/song/detail/?id=${id}&ids=[${id}]`))}`,
            // 10. 网易云直通代理 3 (AllOrigins Get JSON)
            (type, id) => `https://api.allorigins.win/get?url=${encodeURIComponent(type === 'playlist' ? `https://music.163.com/api/v1/playlist/detail?id=${id}` : (type === 'search' ? `https://music.163.com/api/search/get/web?s=${encodeURIComponent(id)}&type=1&offset=0&total=true&limit=20` : `https://music.163.com/api/song/detail/?id=${id}&ids=[${id}]`))}`,
            // 11. PearkTrue 开放接口 (单曲)
            (type, id) => type === 'song' ? `https://api.pearktrue.cn/api/music/netease/?id=${id}` : null,
            // 12. VVHan 开放接口 (单曲)
            (type, id) => type === 'song' ? `https://api.vvhan.com/api/wy/detail?id=${id}` : null
        ];

        async function fetchNetEaseMeting(type, id) {
            for (const buildUrl of METING_MIRRORS) {
                try {
                    const url = buildUrl(type, id);
                    if (!url) continue;

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000); // 4秒超时自动切下一个

                    const res = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (!res.ok) continue;

                    let data = await res.json();

                    // 处理 AllOrigins Get 嵌套包裹结构
                    if (data && data.contents && typeof data.contents === 'string') {
                        try { data = JSON.parse(data.contents); } catch { continue; }
                    }

                    // 1. 标准 Meting 数组格式
                    if (Array.isArray(data) && data.length > 0) {
                        return data.map(item => {
                            const songId = item.id || (item.url && item.url.match(/id=(\d+)/)?.[1]) || (type === 'song' ? id : '');
                            return {
                                id: songId,
                                name: item.name || item.title || '',
                                artist: item.artist || item.author || '未知歌手',
                                pic: item.pic || item.picUrl || ''
                            };
                        });
                    }

                    // 2. 网易云官方单曲对象格式 { songs: [...] }
                    if (data && Array.isArray(data.songs) && data.songs.length > 0) {
                        return data.songs.map(s => ({
                            id: s.id,
                            name: s.name,
                            artist: (s.artists || s.ar || []).map(a => a.name).join('/'),
                            pic: (s.album && s.album.picUrl) || (s.al && s.al.picUrl) || ''
                        }));
                    }

                    // 3. 网易云官方搜索对象格式 { result: { songs: [...] } }
                    if (data && data.result && Array.isArray(data.result.songs) && data.result.songs.length > 0) {
                        return data.result.songs.map(s => ({
                            id: s.id,
                            name: s.name,
                            artist: (s.artists || s.ar || []).map(a => a.name).join('/'),
                            pic: (s.album && s.album.picUrl) || (s.al && s.al.picUrl) || (s.artists && s.artists[0] && s.artists[0].picUrl) || ''
                        }));
                    }

                    // 4. 网易云官方歌单对象格式 { playlist: { tracks: [...] } }
                    if (data && data.playlist && Array.isArray(data.playlist.tracks) && data.playlist.tracks.length > 0) {
                        return data.playlist.tracks.map(s => ({
                            id: s.id,
                            name: s.name,
                            artist: (s.artists || s.ar || []).map(a => a.name).join('/'),
                            pic: (s.album && s.album.picUrl) || (s.al && s.al.picUrl) || ''
                        }));
                    }

                    // 5. 第三方单曲数据对象 (VVHan / PearkTrue)
                    if (data && data.data && typeof data.data === 'object') {
                        const d = data.data;
                        if (d.name || d.title || d.song) {
                            return [{
                                id: id,
                                name: d.name || d.title || d.song || '',
                                artist: d.author || d.singer || d.artist || '未知歌手',
                                pic: d.pic || d.cover || d.img || ''
                            }];
                        }
                    }
                } catch (e) {
                    // 当前镜像超时或异常，自动切入下一个候选节点
                    console.warn(`[Meting Mirror] Failover to next mirror for ${type} ${id}`);
                }
            }
            return null;
        }

        async function loadNetEasePlaylist(playlistId, pillElement) {
            currentPlaylistId = playlistId;
            if (pillElement) {
                document.querySelectorAll('.music-pill').forEach(p => p.classList.remove('active'));
                pillElement.classList.add('active');
            }

            const listArea = document.getElementById('musicSearchResultArea');
            const label = document.getElementById('musicListLabel');

            if (listArea) {
                listArea.innerHTML = `<div style="text-align: center; padding: 24px; color: var(--text-sub); font-size: 0.78rem;"><span>⏳ 正在加载歌单歌曲...</span></div>`;
            }
            if (label) label.textContent = '📜 网易云歌单曲目：';

            try {
                const songs = await fetchNetEaseMeting('playlist', playlistId);
                if (songs && songs.length > 0) {
                    currentLoadedSongs = songs;
                    renderNetEaseSongs(songs);
                } else {
                    listArea.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--text-sub); font-size: 0.78rem;">⚠️ 歌单接口暂忙，您可以直接在上方输入歌名点歌~</div>`;
                }
            } catch (err) {
                console.error('loadNetEasePlaylist failed:', err);
                listArea.innerHTML = `<div style="text-align: center; padding: 20px; color: #BE123C; font-size: 0.78rem;">❌ 歌单加载失败，请检查网络或直接输入歌名点歌~</div>`;
            }
        }

        async function searchNetEaseMusic() {
            const input = document.getElementById('musicSearchInput');
            const listArea = document.getElementById('musicSearchResultArea');
            const label = document.getElementById('musicListLabel');
            let val = (input.value || '').trim();

            if (!val) {
                showMusicToast('⚠️ 请输入歌曲名称、歌手或粘贴网易云分享链接~', '#BE123C', '#FFF1F2', '#FDA4AF');
                input.focus();
                return;
            }

            // 1. Check if user pasted a NetEase Single Song share link or ID (e.g., id=1873049720 or /song?id=1873049720 or /song/1873049720)
            const songIdMatch = val.match(/(?:song\?id=|\/song\/)(\d+)/i);
            if (songIdMatch && songIdMatch[1]) {
                const sId = songIdMatch[1];
                listArea.innerHTML = `<div style="text-align: center; padding: 24px; color: var(--text-sub); font-size: 0.78rem;"><span>🎵 正在解析网易云单曲分享...</span></div>`;
                if (label) label.textContent = `🎵 解析到的网易云单曲：`;

                try {
                    const songs = await fetchNetEaseMeting('song', sId);
                    if (songs && songs.length > 0) {
                        const songObj = songs[0];
                        currentLoadedSongs = [songObj];
                        renderNetEaseSongs([songObj]);
                        return;
                    }
                } catch (e) {
                    console.error('Fetch song failed:', e);
                }

                // Resilient fallback: Even if mirror APIs fail, directly show the extracted ID in list!
                const fallbackObj = {
                    id: sId,
                    name: `网易云单曲 (ID:${sId})`,
                    artist: '网易云音乐',
                    pic: ''
                };
                currentLoadedSongs = [fallbackObj];
                renderNetEaseSongs([fallbackObj]);
                return;
            }

            // 2. Check if user entered a playlist link or ID
            const playlistMatch = val.match(/(?:playlist(?:\?id=|\/)|\/playlist\/)(\d+)/i) || (val.match(/^\d{4,12}$/) ? [null, val] : null);
            if (playlistMatch && playlistMatch[1]) {
                const pId = playlistMatch[1];
                loadNetEasePlaylist(pId, null);
                return;
            }

            // 3. Check if text contains App Share format like "分享回春丹的单曲《初恋》"
            const shareTextMatch = val.match(/分享(.*?)(?:的单曲|的歌曲)《(.*?)》/);
            if (shareTextMatch) {
                const parsedArtist = shareTextMatch[1].trim();
                const parsedSong = shareTextMatch[2].trim();
                val = `${parsedSong} ${parsedArtist}`;
            } else {
                // Strip common noise like "(来自@网易云音乐)" and urls
                val = val.replace(/\(来自@网易云音乐\)/g, '').replace(/https?:\/\/\S+/g, '').trim() || val;
            }

            // 4. Search by keyword using the multi-mirror pool!
            listArea.innerHTML = `<div style="text-align: center; padding: 24px; color: var(--text-sub); font-size: 0.78rem;"><span>🔍 正在搜索网易云音乐曲库...</span></div>`;
            if (label) label.textContent = `🔍 搜索 “${val}” 的结果：`;

            try {
                const songs = await fetchNetEaseMeting('search', val);
                if (songs && songs.length > 0) {
                    currentLoadedSongs = songs;
                    renderNetEaseSongs(songs);
                } else {
                    // Fallback to manual selection prompt
                    listArea.innerHTML = `
                        <div style="text-align: center; padding: 18px; color: var(--text-sub); font-size: 0.78rem;">
                            <p style="margin-bottom: 8px;">未在曲库找到完全匹配的结果，您可以直接点歌：</p>
                            <button type="button" class="music-pick-btn" style="padding: 6px 14px; font-size: 0.75rem;" onclick="selectSong('', '${escapeHtml(val)}', '未指定', '')">👉 点歌《${escapeHtml(val)}》</button>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('searchNetEaseMusic failed:', err);
                listArea.innerHTML = `
                    <div style="text-align: center; padding: 18px; color: var(--text-sub); font-size: 0.78rem;">
                        <p style="margin-bottom: 8px;">搜索服务暂忙，您可以直接点这首歌：</p>
                        <button type="button" class="music-pick-btn" style="padding: 6px 14px; font-size: 0.75rem;" onclick="selectSong('', '${escapeHtml(val)}', '未指定', '')">👉 点歌《${escapeHtml(val)}》</button>
                    </div>
                `;
            }
        }

        function renderNetEaseSongs(songs) {
            const listArea = document.getElementById('musicSearchResultArea');
            if (!listArea) return;

            if (!songs || songs.length === 0) {
                listArea.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--text-sub); font-size: 0.78rem;">暂无歌曲数据</div>`;
                return;
            }

            listArea.innerHTML = songs.map((s, idx) => {
                const songId = s.id || '';
                const songNameEsc = escapeHtml(s.name);
                const artistEsc = escapeHtml(s.artist || '未知歌手');
                const picUrl = s.pic || '';

                return `
                    <div class="music-item-row">
                        <div class="music-item-left">
                            ${picUrl ? `<img src="${picUrl}" class="music-item-pic" alt="cover" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'34\\' height=\\'34\\' viewBox=\\'0 0 34 34\\'><rect fill=\\'%23FFE4E6\\' width=\\'34\\' height=\\'34\\'/><text fill=\\'%23E11D48\\' font-size=\\'16\\' x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'central\\' text-anchor=\\'middle\\'>🎵</text></svg>'">` : `<div class="music-item-pic" style="display:flex;align-items:center;justify-content:center;font-size:16px;">🎵</div>`}
                            <div class="music-item-meta">
                                <span class="music-item-name" title="${songNameEsc}">${songNameEsc}</span>
                                <span class="music-item-artist" title="${artistEsc}">${artistEsc}${songId ? ` · ID:${songId}` : ''}</span>
                            </div>
                        </div>
                        <button type="button" class="music-pick-btn" onclick="selectSong('${songId}', '${songNameEsc}', '${artistEsc}', '${picUrl}')">点这首 🐾</button>
                    </div>
                `;
            }).join('');
        }

        function selectSong(id, name, artist, pic) {
            const songIdInput = document.getElementById('musicSongId');
            const songNameInput = document.getElementById('musicSongName');
            const artistInput = document.getElementById('musicArtist');
            const selectedBox = document.getElementById('selectedSongBox');
            const dispName = document.getElementById('dispSelectedSong');
            const dispArtist = document.getElementById('dispSelectedArtist');

            if (songIdInput) songIdInput.value = id || '';
            if (songNameInput) songNameInput.value = name;
            if (artistInput) artistInput.value = artist;

            if (dispName) dispName.textContent = `🎵 已选：${name}${id ? ` (ID: ${id})` : ''}`;
            if (dispArtist) dispArtist.textContent = `🎤 歌手：${artist || '未指定'}`;
            if (selectedBox) selectedBox.style.display = 'block';

            // Directly submit the song request with 1-click
            submitSongRequest();
        }

        async function submitSongRequest() {
            const songId = (document.getElementById('musicSongId')?.value || '').trim();
            const songName = (document.getElementById('musicSongName')?.value || '').trim();
            const artist = (document.getElementById('musicArtist')?.value || '').trim();
            const submitBtn = document.getElementById('btnSubmitSong');
            const submitBtnText = document.getElementById('btnSubmitSongText');

            if (!songId && !songName) {
                showMusicToast('⚠️ 请先在上方列表中点击「点这首」选择一首歌曲哦~', '#BE123C', '#FFF1F2', '#FDA4AF');
                const searchInput = document.getElementById('musicSearchInput');
                if (searchInput) {
                    searchInput.focus();
                    searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            // Cooldown check (prevent spamming: 20 seconds cooldown)
            const lastSent = localStorage.getItem('ntfy_last_song_sent');
            const now = Date.now();
            if (lastSent && (now - parseInt(lastSent)) < 2000) {
                const waitSec = Math.ceil((2000 - (now - parseInt(lastSent))) / 1000);
                showMusicToast(`⏳ 点歌太快啦，请等待 ${waitSec} 秒后再点下一首哦~`, '#D97706', '#FEF3C7', '#FCD34D');
                return;
            }

            if (submitBtn) submitBtn.disabled = true;
            if (submitBtnText) submitBtnText.textContent = '正在点歌...';

            const topic = 'XingYeShouZuo';
            const nowTimeStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // The core payload message transmits the pure Song ID (fallback to name if no ID)
            const messageBody = songId ? `${songId}` : `${songName}`;

            try {
                const response = await fetch('https://ntfy.sh', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        topic: topic,
                        title: `🎵 点歌: ${songName}${songId ? ` (${songId})` : ''}`,
                        message: messageBody,
                        tags: ['musical_note', 'sparkles'],
                        priority: 4,
                        click: songId ? `https://music.163.com/song?id=${songId}` : undefined
                    })
                });

                if (response.ok) {
                    localStorage.setItem('ntfy_last_song_sent', Date.now().toString());
                    showMusicToast(`🎉 点歌成功！已传输歌曲ID [${songId || songName}]，当前歌曲播放完毕后将为您播放《${songName}》~ 🐱`, '#15803D', '#F0FDF4', '#86EFAC');
                    
                    // Start 20s cooldown countdown
                    let countdown = 20;
                    const timer = setInterval(() => {
                        countdown--;
                        if (countdown > 0) {
                            if (submitBtnText) submitBtnText.textContent = `冷却中 (${countdown}s)`;
                        } else {
                            clearInterval(timer);
                            if (submitBtn) submitBtn.disabled = false;
                            if (submitBtnText) submitBtnText.textContent = '再次点歌 🐾';
                        }
                    }, 1000);
                } else {
                    throw new Error(`Status: ${response.status}`);
                }
            } catch (err) {
                console.error('ntfy push failed:', err);
                if (submitBtn) submitBtn.disabled = false;
                if (submitBtnText) submitBtnText.textContent = '立即点歌 🐾';
                showMusicToast('❌ 点歌失败，请检查网络连接后重试~', '#BE123C', '#FFF1F2', '#FDA4AF');
            }
        }

        function showMusicToast(text, color, bg, border) {
            const toast = document.getElementById('musicToast');
            if (!toast) return;
            toast.style.display = 'block';
            toast.style.color = color;
            toast.style.background = bg;
            toast.style.borderColor = border;
            toast.textContent = text;
        }

        // Auto load initial popular playlist when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            loadNetEasePlaylist('3778678', document.getElementById('pill-3778678'));
        });
    </script>
