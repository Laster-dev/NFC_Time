<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 星野手作 | 计时工坊 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-hoshino: #fff5f8;
            --bg-card: #ffffff;
            --primary-pink: #ff6b8b;
            --primary-pink-soft: #ffeef2;
            --primary-pink-deep: #ff4772;
            
            --color-mint: #10b981;
            --color-mint-bg: #e6f9f0;
            --color-amber: #f59e0b;
            --color-amber-bg: #fffbeb;
            --color-rose: #f43f5e;
            --color-rose-bg: #fff1f2;
            --color-slate: #64748b;
            
            --text-title: #2d2327;
            --text-sub: #8c7a82;
            
            --shadow-kawaii: 0 10px 25px rgba(255, 107, 139, 0.12);
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comfortaa', 'ZCOOL KuaiLe', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-hoshino);
            background-image: 
                radial-gradient(#ffd6e0 1.5px, transparent 1.5px),
                radial-gradient(#ffd6e0 1.5px, #fff5f8 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .hoshino-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Kawaii Header */
        .hoshino-header {
            background: #ffffff;
            border-radius: 28px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-kawaii);
            border: 3px solid #ffdeee;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-avatar {
            font-size: 2.2rem;
            animation: float-anim 3s ease-in-out infinite;
        }

        @keyframes float-anim {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(3deg); }
        }

        .hoshino-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary-pink-deep);
            letter-spacing: 1px;
        }

        .hoshino-sub {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .counter-badge {
            background: var(--primary-pink-soft);
            color: var(--primary-pink-deep);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 2px solid #ffccd8;
        }

        /* Summary Chips */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .summary-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            box-shadow: var(--shadow-card);
            border: 2px solid #ffeef2;
        }

        .sum-icon { font-size: 1.1rem; }
        .sum-num { font-size: 1.25rem; font-weight: 800; }
        .sum-txt { font-size: 0.68rem; color: var(--text-sub); }

        .sum-run .sum-num { color: var(--color-mint); }
        .sum-pause .sum-num { color: var(--color-amber); }
        .sum-stop .sum-num { color: var(--color-slate); }
        .sum-expire .sum-num { color: var(--color-rose); }

        /* Filter Tabs Bar */
        .tabs-nav {
            display: flex;
            background: #ffffff;
            padding: 6px;
            border-radius: 22px;
            box-shadow: var(--shadow-card);
            border: 2px solid #ffeef2;
            gap: 4px;
        }

        .tab-item {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-sub);
            padding: 10px 0;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-item.active {
            background: linear-gradient(135deg, #ff7597, #ff4772);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 71, 114, 0.3);
        }

        /* Cute Card List */
        .card-stream {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 30px;
        }

        .kawaii-card {
            background: #ffffff;
            border-radius: 26px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: var(--shadow-card);
            border: 3px solid #ffedf2;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .kawaii-card.card-expired-mode {
            border-color: #ffb3c1;
            background: linear-gradient(180deg, #ffffff 0%, #fff0f3 100%);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title-name {
            font-size: 1.18rem;
            font-weight: 800;
            color: var(--text-title);
        }

        .card-uid-pill {
            font-size: 0.72rem;
            font-family: monospace;
            color: var(--text-sub);
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 4px;
        }

        .badge-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .badge-mint { background: var(--color-mint-bg); color: var(--color-mint); }
        .badge-amber { background: var(--color-amber-bg); color: var(--color-amber); }
        .badge-slate { background: #f1f5f9; color: var(--color-slate); }
        .badge-rose { background: var(--color-rose-bg); color: var(--color-rose); }

        .timer-center {
            text-align: center;
            padding: 4px 0;
        }

        .time-display-big {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .time-display-big.text-mint { color: var(--color-mint); }
        .time-display-big.text-amber { color: var(--color-amber); }
        .time-display-big.text-rose { color: var(--color-rose); }

        .overdue-banner {
            color: var(--color-rose);
            font-weight: 800;
            font-size: 0.92rem;
            margin-top: 4px;
        }

        /* Timeline Box for Start and End Time */
        .timeline-box {
            background: #fff8fa;
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-sub);
            border: 1px dashed #ffd6e0;
        }

        .timeline-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .timeline-label {
            font-size: 0.7rem;
            color: #b09ba5;
        }

        .timeline-val {
            font-weight: 700;
            color: var(--text-title);
        }

        .progress-bar-wrap {
            height: 10px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9ebb, #10b981);
            border-radius: 10px;
            transition: width 0.5s ease-out;
        }

        .empty-cute-view {
            text-align: center;
            padding: 60px 20px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: var(--shadow-card);
            color: var(--text-sub);
            border: 2px dashed #ffd6e0;
        }

        .empty-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="hoshino-container">
        <!-- Header -->
        <header class="hoshino-header">
            <div class="brand-group">
                <span class="brand-avatar">🌸</span>
                <div>
                    <h1 class="hoshino-title">星野手作</h1>
                    <p class="hoshino-sub">✦ 陪伴每一份温暖时光 ✦</p>
                </div>
            </div>
            <div class="counter-badge">
                <span id="cardCounter">0 份手作</span>
            </div>
        </header>

        <!-- Summary -->
        <div class="summary-grid">
            <div class="summary-card sum-run">
                <span class="sum-icon">🌟</span>
                <span class="sum-num" id="countRunning">0</span>
                <span class="sum-txt">制作中</span>
            </div>
            <div class="summary-card sum-pause">
                <span class="sum-icon">🍵</span>
                <span class="sum-num" id="countPaused">0</span>
                <span class="sum-txt">憩息中</span>
            </div>
            <div class="summary-card sum-stop">
                <span class="sum-icon">🌸</span>
                <span class="sum-num" id="countStopped">0</span>
                <span class="sum-txt">准备中</span>
            </div>
            <div class="summary-card sum-expire">
                <span class="sum-icon">🔔</span>
                <span class="sum-num" id="countExpired">0</span>
                <span class="sum-txt">时间到</span>
            </div>
        </div>

        <!-- Filter Nav -->
        <nav class="tabs-nav">
            <button type="button" class="tab-item active" data-filter="all">✨ 全部手作</button>
            <button type="button" class="tab-item" data-filter="running">🌟 制作中</button>
            <button type="button" class="tab-item" data-filter="expired">🔔 时间到</button>
        </nav>

        <!-- Stream Cards -->
        <main class="card-stream" id="cardsGrid">
            <!-- Dynamic cards -->
        </main>
    </div>

    <script>
        let currentFilter = 'all';
        let cachedCardsData = [];

        const FIXED_GIST_ID = "6582c66b24bad75381f70abdae62e81b";
        const RAW_GIST_URL = `https://gist.githubusercontent.com/raw/${FIXED_GIST_ID}/cards_data.json`;

        document.addEventListener('DOMContentLoaded', () => {
            const tabItems = document.querySelectorAll('.tab-item');
            tabItems.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabItems.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentFilter = target.getAttribute('data-filter') || 'all';
                    renderDashboard(cachedCardsData);
                });
            });

            fetchCardsFromGist();
            
            // 1. Fetch remote data every 5 seconds
            setInterval(fetchCardsFromGist, 5000);

            // 2. Tick UI timer display every 1 second locally
            setInterval(tickLocalTimers, 1000);
        });

        async function fetchCardsFromGist() {
            try {
                const res = await fetch(`${RAW_GIST_URL}?t=${Date.now()}`);
                if (!res.ok) return;
                const fileContent = await res.text();

                if (fileContent) {
                    try {
                        cachedCardsData = JSON.parse(fileContent);
                    } catch (parseErr) {
                        cachedCardsData = [];
                    }
                    renderDashboard(cachedCardsData);
                }
            } catch (err) {
                console.error('Failed to fetch from Raw Gist CDN:', err);
            }
        }

        function tickLocalTimers() {
            if (cachedCardsData.length > 0) {
                renderDashboard(cachedCardsData);
            }
        }

        function computeCardsState(cards) {
            if (!Array.isArray(cards)) return [];
            const now = Date.now();

            return cards.map(c => {
                let remaining = c.savedRemainingSeconds || 0;
                let status = c.status; // 0: Stopped, 1: Running, 2: Paused, 3: Expired

                let startTimeStr = "--:--";
                let endTimeStr = "--:--";

                if (c.startTimeUtc) {
                    const startMs = new Date(c.startTimeUtc).getTime();
                    startTimeStr = formatClockTime(startMs);

                    if (c.targetDurationSeconds > 0) {
                        const endMs = startMs + (c.targetDurationSeconds * 1000);
                        endTimeStr = formatClockTime(endMs);
                    }

                    if (status === 1) {
                        const elapsed = (now - startMs) / 1000;
                        remaining = (c.savedRemainingSeconds || 0) - elapsed;
                        if (remaining <= 0) {
                            status = 3; // Expired
                        }
                    }
                }

                const isOverdue = remaining < 0 && (status === 1 || status === 3);
                const overdueSeconds = isOverdue ? Math.abs(remaining) : 0;

                return {
                    ...c,
                    status,
                    remainingSeconds: remaining,
                    overdueSeconds,
                    isOverdue,
                    startTimeStr,
                    endTimeStr
                };
            });
        }

        function formatClockTime(timestampMs) {
            if (!timestampMs || isNaN(timestampMs)) return "--:--";
            const date = new Date(timestampMs);
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function formatTime(totalSeconds) {
            const isNegative = totalSeconds < 0;
            const absSeconds = Math.abs(Math.floor(totalSeconds));
            
            const h = Math.floor(absSeconds / 3600);
            const m = Math.floor((absSeconds % 3600) / 60);
            const s = absSeconds % 60;

            const pad = n => n.toString().padStart(2, '0');
            let str = `${pad(m)}:${pad(s)}`;
            if (h > 0) str = `${pad(h)}:` + str;
            
            return isNegative ? `-${str}` : str;
        }

        function renderDashboard(rawCards) {
            const cards = computeCardsState(rawCards);

            let running = 0, paused = 0, stopped = 0, expired = 0;
            cards.forEach(c => {
                if (c.isOverdue || c.status === 3) expired++;
                else if (c.status === 1) running++;
                else if (c.status === 2) paused++;
                else stopped++;
            });

            document.getElementById('cardCounter').textContent = `${cards.length} 份手作`;
            document.getElementById('countRunning').textContent = running;
            document.getElementById('countPaused').textContent = paused;
            document.getElementById('countStopped').textContent = stopped;
            document.getElementById('countExpired').textContent = expired;

            const filtered = cards.filter(c => {
                if (currentFilter === 'running') return c.status === 1 && !c.isOverdue;
                if (currentFilter === 'expired') return c.isOverdue || c.status === 3;
                return true;
            });

            const grid = document.getElementById('cardsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-cute-view">
                        <div class="empty-icon">🌸</div>
                        <p>暂无手作在制作中哦~<br>期待下一次美好相遇 ✨</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(card => {
                let isExpiredMode = card.isOverdue || card.status === 3;
                let badgeClass = 'badge-slate';
                let statusText = '🌸 准备中';
                let timeColorClass = '';

                if (isExpiredMode) {
                    badgeClass = 'badge-rose';
                    statusText = '🔔 时间到';
                    timeColorClass = 'text-rose';
                } else if (card.status === 1) {
                    badgeClass = 'badge-mint';
                    statusText = '🌟 制作中';
                    timeColorClass = 'text-mint';
                } else if (card.status === 2) {
                    badgeClass = 'badge-amber';
                    statusText = '🍵 憩息中';
                    timeColorClass = 'text-amber';
                }

                const remainingSec = card.remainingSeconds;
                const targetSec = card.targetDurationSeconds;
                let pct = 100;
                if (targetSec > 0) {
                    pct = Math.max(0, Math.min(100, (remainingSec / targetSec) * 100));
                }

                let timeHtml = '';
                if (isExpiredMode) {
                    timeHtml = `
                        <div class="time-display-big text-rose">00:00</div>
                        <div class="overdue-banner">🚨 已超时: ${formatTime(card.overdueSeconds)}</div>
                    `;
                } else {
                    timeHtml = `
                        <div class="time-display-big ${timeColorClass}">
                            ${formatTime(remainingSec)}
                        </div>
                    `;
                }

                return `
                    <div class="kawaii-card ${isExpiredMode ? 'card-expired-theme' : ''}">
                        <div class="card-top">
                            <div>
                                <div class="card-title-name">${escapeHtml(card.name)}</div>
                                <div class="card-uid-pill">UID: ${escapeHtml(card.cardId)}</div>
                            </div>
                            <span class="badge-tag ${badgeClass}">${statusText}</span>
                        </div>

                        <div class="timer-center">
                            ${timeHtml}
                        </div>

                        <!-- Timeline (Start & Expected End Time) -->
                        <div class="timeline-box">
                            <div class="timeline-item">
                                <span class="timeline-label">▶ 开始时间</span>
                                <span class="timeline-val">${card.startTimeStr}</span>
                            </div>
                            <div class="timeline-item" style="text-align: right;">
                                <span class="timeline-label">🏁 预计到期</span>
                                <span class="timeline-val">${card.endTimeStr}</span>
                            </div>
                        </div>

                        <div class="progress-bar-wrap">
                            <div class="progress-bar-fill" style="width: ${isExpiredMode ? 0 : pct}%; ${card.status === 2 ? 'background: #f59e0b' : ''}"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
