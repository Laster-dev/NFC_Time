<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 星野手作 | 桌面计时小屋 🌙</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hoshino-app">
        <!-- Hoshino Starry Header -->
        <header class="hoshino-header">
            <div class="brand-box">
                <span class="star-icon">✨</span>
                <div>
                    <h1 class="hoshino-title">星野手作</h1>
                    <p class="hoshino-subtitle">✦ 陪伴每一份温暖时光 ✦</p>
                </div>
            </div>
            <div class="moon-badge">
                <span class="moon-twinkle">🌙</span>
                <span id="cardCounter">0 份手作</span>
            </div>
        </header>

        <!-- Starlight Summary Pills -->
        <div class="star-summary">
            <div class="chip chip-run">
                <span class="chip-emoji">🌟</span>
                <span class="chip-num" id="countRunning">0</span>
                <span class="chip-txt">制作中</span>
            </div>
            <div class="chip chip-pause">
                <span class="chip-emoji">🍵</span>
                <span class="chip-num" id="countPaused">0</span>
                <span class="chip-txt">憩息中</span>
            </div>
            <div class="chip chip-stop">
                <span class="chip-emoji">🌸</span>
                <span class="chip-num" id="countStopped">0</span>
                <span class="chip-txt">准备中</span>
            </div>
            <div class="chip chip-expire">
                <span class="chip-emoji">🔔</span>
                <span class="chip-num" id="countExpired">0</span>
                <span class="chip-txt">时间到啦</span>
            </div>
        </div>

        <!-- Starry Tab Bar Filter -->
        <nav class="hoshino-tabs">
            <button type="button" class="tab-btn active" data-filter="all">✨ 全部手作</button>
            <button type="button" class="tab-btn" data-filter="running">🌟 制作中</button>
            <button type="button" class="tab-btn" data-filter="expired">🔔 时间到</button>
        </nav>

        <!-- Hoshino Handmade Cards Stream -->
        <main class="hoshino-card-stream" id="cardsGrid">
            <!-- Dynamic Hoshino Cards -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
