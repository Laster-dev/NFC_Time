<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星野手作 | 桌面计时工坊</title>
    <style>
        :root {
            /* Elegant Cream & Japanese Warm Aesthetic Palette */
            --bg-page: #FAF8F5;
            --bg-card: #FFFFFF;
            --border-subtle: #ECE7E1;
            --border-hover: #D4C9BC;
            
            --text-primary: #2C2825;
            --text-secondary: #78716C;
            --text-tertiary: #A8A29E;
            
            --accent-warm: #E07A5F;
            --accent-warm-soft: #FDF0ED;
            
            --status-mint: #2A9D8F;
            --status-mint-bg: #E8F5F3;
            --status-amber: #E9C46A;
            --status-amber-bg: #FEF9EB;
            --status-rose: #E76F51;
            --status-rose-bg: #FDF0EC;
            --status-gray: #A8A29E;
            --status-gray-bg: #F5F5F4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .workshop-app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Minimal Elegant Top Bar */
        .workshop-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 4px 2px;
        }

        .brand-title-wrap {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .brand-subtitle {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .total-counter {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-warm);
            background: var(--accent-warm-soft);
            padding: 3px 8px;
            border-radius: 6px;
        }

        /* Sleek Control Segment */
        .control-segment {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        .filter-group {
            display: flex;
            gap: 2px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-secondary);
            padding: 5px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .filter-btn.active {
            background: var(--text-primary);
            color: #FFFFFF;
        }

        .stat-indicator {
            display: flex;
            gap: 8px;
            padding-right: 6px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .indicator-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .dot-mint { background: var(--status-mint); }
        .dot-rose { background: var(--status-rose); }

        /* High-Density 2-Column Grid Layout */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-bottom: 24px;
        }

        .hoshino-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            border: 1px solid var(--border-subtle);
            transition: border-color 0.2s;
        }

        .hoshino-card:hover {
            border-color: var(--border-hover);
        }

        .hoshino-card.card-overdue {
            border-color: #F87171;
            background: #FFFDFD;
        }

        .card-header-line {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title-text {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .card-uid-sub {
            font-size: 0.65rem;
            font-family: monospace;
            color: var(--text-tertiary);
            margin-top: 1px;
        }

        .status-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .tag-mint { background: var(--status-mint-bg); color: var(--status-mint); }
        .tag-amber { background: var(--status-amber-bg); color: var(--status-amber); }
        .tag-gray { background: var(--status-gray-bg); color: var(--status-gray); }
        .tag-rose { background: var(--status-rose-bg); color: var(--status-rose); }

        .time-box-center {
            text-align: center;
            padding: 2px 0;
        }

        .time-clock-big {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: "SF Mono", Consolas, monospace;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .time-clock-big.text-mint { color: var(--status-mint); }
        .time-clock-big.text-amber { color: var(--status-amber); }
        .time-clock-big.text-rose { color: var(--status-rose); }

        .overdue-txt-sub {
            color: var(--status-rose);
            font-weight: 700;
            font-size: 0.7rem;
            margin-top: 3px;
        }

        .timeline-strip {
            background: #FDFBF7;
            border-radius: 6px;
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .tl-col {
            display: flex;
            flex-direction: column;
        }

        .tl-lbl {
            font-size: 0.6rem;
            color: var(--text-tertiary);
        }

        .tl-val {
            font-weight: 600;
            color: var(--text-primary);
        }

        .progress-bar-bg {
            height: 4px;
            background: var(--border-subtle);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--status-mint);
            border-radius: 4px;
            transition: width 0.5s ease-out;
        }

        .empty-placeholder {
            grid-column: span 2;
            text-align: center;
            padding: 40px 10px;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px dashed var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="workshop-app">
        <!-- Top Minimal Header -->
        <header class="workshop-header">
            <div class="brand-title-wrap">
                <h1 class="brand-title">星野手作</h1>
                <span class="brand-subtitle">桌面工坊</span>
            </div>
            <div class="total-counter" id="cardCounter">0 份手作</div>
        </header>

        <!-- Minimal Segmented Filter Bar -->
        <div class="control-segment">
            <div class="filter-group">
                <button type="button" class="filter-btn active" data-filter="all">全部</button>
                <button type="button" class="filter-btn" data-filter="running">制作中</button>
                <button type="button" class="filter-btn" data-filter="expired">时间到</button>
            </div>

            <div class="stat-indicator">
                <div class="indicator-item">
                    <span class="dot dot-mint"></span>
                    <span id="countRunning">0</span>
                </div>
                <div class="indicator-item">
                    <span class="dot dot-rose"></span>
                    <span id="countExpired">0</span>
                </div>
            </div>
        </div>

        <!-- 2-Column Cards Grid -->
        <main class="card-grid" id="cardsGrid">
            <!-- Dynamic Cards -->
        </main>
    </div>

    <script>
        let currentFilter = 'all';
        let cachedCardsData = [];

        const FIXED_GIST_ID = "6582c66b24bad75381f70abdae62e81b";
        const RAW_GIST_URL = `https://gist.githubusercontent.com/raw/${FIXED_GIST_ID}/cards_data.json`;

        document.addEventListener('DOMContentLoaded', () => {
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentFilter = target.getAttribute('data-filter') || 'all';
                    renderDashboard(cachedCardsData);
                });
            });

            fetchCardsFromGist();
            setInterval(fetchCardsFromGist, 5000); // Poll Gist every 5s
            setInterval(tickLocalTimers, 1000);     // Tick UI timer every 1s
        });

        async function fetchCardsFromGist() {
            try {
                const res = await fetch(`${RAW_GIST_URL}?t=${Date.now()}`);
                if (!res.ok) return;
                const fileContent = await res.text();

                if (fileContent) {
                    try {
                        cachedCardsData = JSON.parse(fileContent);
                    } catch (parseErr) {
                        cachedCardsData = [];
                    }
                    renderDashboard(cachedCardsData);
                }
            } catch (err) {
                console.error('Failed to fetch from Raw Gist CDN:', err);
            }
        }

        function tickLocalTimers() {
            if (cachedCardsData.length > 0) {
                renderDashboard(cachedCardsData);
            }
        }

        function computeCardsState(cards) {
            if (!Array.isArray(cards)) return [];
            const now = Date.now();

            return cards.map(c => {
                let remaining = c.savedRemainingSeconds || 0;
                let status = c.status; // 0: Stopped, 1: Running, 2: Paused, 3: Expired

                let startTimeStr = "--:--";
                let endTimeStr = "--:--";

                if (c.startTimeUtc) {
                    const startMs = new Date(c.startTimeUtc).getTime();
                    startTimeStr = formatClockTime(startMs);

                    if (c.targetDurationSeconds > 0) {
                        const endMs = startMs + (c.targetDurationSeconds * 1000);
                        endTimeStr = formatClockTime(endMs);
                    }

                    if (status === 1) {
                        const elapsed = (now - startMs) / 1000;
                        remaining = (c.savedRemainingSeconds || 0) - elapsed;
                        if (remaining <= 0) {
                            status = 3; // Expired
                        }
                    }
                }

                const isOverdue = remaining < 0 && (status === 1 || status === 3);
                const overdueSeconds = isOverdue ? Math.abs(remaining) : 0;

                return {
                    ...c,
                    status,
                    remainingSeconds: remaining,
                    overdueSeconds,
                    isOverdue,
                    startTimeStr,
                    endTimeStr
                };
            });
        }

        function formatClockTime(timestampMs) {
            if (!timestampMs || isNaN(timestampMs)) return "--:--";
            const date = new Date(timestampMs);
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function formatTime(totalSeconds) {
            const isNegative = totalSeconds < 0;
            const absSeconds = Math.abs(Math.floor(totalSeconds));
            
            const h = Math.floor(absSeconds / 3600);
            const m = Math.floor((absSeconds % 3600) / 60);
            const s = absSeconds % 60;

            const pad = n => n.toString().padStart(2, '0');
            let str = `${pad(m)}:${pad(s)}`;
            if (h > 0) str = `${pad(h)}:` + str;
            
            return isNegative ? `-${str}` : str;
        }

        function renderDashboard(rawCards) {
            const cards = computeCardsState(rawCards);

            let running = 0, expired = 0;
            cards.forEach(c => {
                if (c.isOverdue || c.status === 3) expired++;
                else if (c.status === 1) running++;
            });

            document.getElementById('cardCounter').textContent = `${cards.length} 份手作`;
            document.getElementById('countRunning').textContent = running;
            document.getElementById('countExpired').textContent = expired;

            const filtered = cards.filter(c => {
                if (currentFilter === 'running') return c.status === 1 && !c.isOverdue;
                if (currentFilter === 'expired') return c.isOverdue || c.status === 3;
                return true;
            });

            const grid = document.getElementById('cardsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-placeholder">
                        暂无制作中的手作记录
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(card => {
                let isExpiredMode = card.isOverdue || card.status === 3;
                let tagClass = 'tag-gray';
                let statusText = '准备中';
                let timeColorClass = '';

                if (isExpiredMode) {
                    tagClass = 'tag-rose';
                    statusText = '时间到';
                    timeColorClass = 'text-rose';
                } else if (card.status === 1) {
                    tagClass = 'tag-mint';
                    statusText = '制作中';
                    timeColorClass = 'text-mint';
                } else if (card.status === 2) {
                    tagClass = 'tag-amber';
                    statusText = '憩息中';
                    timeColorClass = 'text-amber';
                }

                const remainingSec = card.remainingSeconds;
                const targetSec = card.targetDurationSeconds;
                let pct = 100;
                if (targetSec > 0) {
                    pct = Math.max(0, Math.min(100, (remainingSec / targetSec) * 100));
                }

                let timeHtml = '';
                if (isExpiredMode) {
                    timeHtml = `
                        <div class="time-clock-big text-rose">00:00</div>
                        <div class="overdue-txt-sub">超时: ${formatTime(card.overdueSeconds)}</div>
                    `;
                } else {
                    timeHtml = `
                        <div class="time-clock-big ${timeColorClass}">
                            ${formatTime(remainingSec)}
                        </div>
                    `;
                }

                return `
                    <div class="hoshino-card ${isExpiredMode ? 'card-overdue' : ''}">
                        <div>
                            <div class="card-header-line">
                                <div class="card-title-text" title="${escapeHtml(card.name)}">${escapeHtml(card.name)}</div>
                                <span class="status-tag ${tagClass}">${statusText}</span>
                            </div>
                            <div class="card-uid-sub">UID: ${escapeHtml(card.cardId)}</div>
                        </div>

                        <div class="time-box-center">
                            ${timeHtml}
                        </div>

                        <!-- Timeline -->
                        <div class="timeline-strip">
                            <div class="tl-col">
                                <span class="tl-lbl">开始</span>
                                <span class="tl-val">${card.startTimeStr}</span>
                            </div>
                            <div class="tl-col" style="text-align: right;">
                                <span class="tl-lbl">到期</span>
                                <span class="tl-val">${card.endTimeStr}</span>
                            </div>
                        </div>

                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${isExpiredMode ? 0 : pct}%; ${card.status === 2 ? 'background: #E9C46A' : ''}"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
