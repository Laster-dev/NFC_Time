<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 星野手作 | 萌趣时光小屋 🐱</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Warm Creamy Craft Palette (暖奶油/纸艺/手作感) */
            --bg-page: #FFFDF9;
            --bg-card: #FFFFFF;
            --border-craft: #F4E8D6;
            --border-dashed: #E6D2B8;
            
            --text-dark: #4A3E3D;
            --text-sub: #9E8E8C;
            
            --color-cream-yellow: #FEF3C7;
            --color-cream-yellow-border: #FCD34D;
            --color-yellow-text: #D97706;
            
            --color-mint-soft: #D1FAE5;
            --color-mint-border: #6EE7B7;
            --color-mint-text: #059669;
            
            --color-rose-soft: #FFE4E6;
            --color-rose-border: #FDA4AF;
            --color-rose-text: #E11D48;

            --color-blue-soft: #E0F2FE;
            --color-blue-text: #0284C7;
            
            --shadow-kawaii: 0 6px 16px rgba(158, 142, 140, 0.08);
            --shadow-hover: 0 10px 24px rgba(158, 142, 140, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'ZCOOL KuaiLe', -apple-system, BlinkMacSystemFont, "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(#F3E5D8 1.5px, transparent 1.5px),
                radial-gradient(#F3E5D8 1.5px, #FFFDF9 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .kawaii-workshop {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Handmade Craft Header */
        .craft-header {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-kawaii);
            border: 3px dashed var(--border-dashed);
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mascot-icon {
            font-size: 2.2rem;
            animation: cute-wobble 3s ease-in-out infinite;
        }

        @keyframes cute-wobble {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg) scale(1.08); }
        }

        .shop-name {
            font-size: 1.3rem;
            color: var(--text-dark);
            line-height: 1.1;
        }

        .shop-slogan {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 3px;
        }

        .hand-badge {
            background: var(--color-cream-yellow);
            border: 2px solid var(--color-cream-yellow-border);
            color: var(--color-yellow-text);
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* Cute Tabs Filter */
        .tabs-pill-bar {
            display: flex;
            background: #FFFFFF;
            padding: 6px;
            border-radius: 20px;
            box-shadow: var(--shadow-kawaii);
            border: 2px solid var(--border-craft);
            gap: 4px;
        }

        .tab-pill {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-sub);
            padding: 8px 0;
            font-size: 0.85rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .tab-pill.active {
            background: #FFE4E6;
            color: #E11D48;
            border: 2px solid #FDA4AF;
            font-weight: bold;
        }

        /* Dual Column Hand-crafted Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 30px;
        }

        .cute-card {
            background: #FFFFFF;
            border-radius: 22px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            box-shadow: var(--shadow-kawaii);
            border: 3px solid var(--border-craft);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cute-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .cute-card.card-overdue-mode {
            border-color: var(--color-rose-border);
            background: linear-gradient(180deg, #FFFFFF 0%, #FFF5F5 100%);
            animation: soft-pulse 2s infinite alternate;
        }

        @keyframes soft-pulse {
            0% { border-color: #FDA4AF; }
            100% { border-color: #F43F5E; }
        }

        .card-head-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-name-title {
            font-size: 0.98rem;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 95px;
        }

        .cute-tag {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            border: 1.5px solid transparent;
        }

        .tag-mint { background: var(--color-mint-soft); border-color: var(--color-mint-border); color: var(--color-mint-text); }
        .tag-amber { background: var(--color-cream-yellow); border-color: var(--color-cream-yellow-border); color: var(--color-yellow-text); }
        .tag-gray { background: #F3F4F6; border-color: #E5E7EB; color: #6B7280; }
        .tag-rose { background: var(--color-rose-soft); border-color: var(--color-rose-border); color: var(--color-rose-text); }

        .card-uid-sub {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 1px;
        }

        .time-box-center {
            text-align: center;
            padding: 4px 0;
        }

        .clock-val-cute {
            font-size: 1.7rem;
            font-family: monospace;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .clock-val-cute.text-mint { color: var(--color-mint-text); }
        .clock-val-cute.text-amber { color: var(--color-yellow-text); }
        .clock-val-cute.text-rose { color: var(--color-rose-text); }

        /* Cute Overdue Banner with Ticking Time */
        .overdue-cute-banner {
            color: var(--color-rose-text);
            background: var(--color-rose-soft);
            border: 1.5px solid var(--color-rose-border);
            padding: 4px 8px;
            border-radius: 14px;
            font-size: 0.72rem;
            margin-top: 6px;
            display: inline-block;
        }

        /* Timeline Box */
        .stamp-timeline {
            background: #FAF5EE;
            border-radius: 12px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-sub);
            border: 1.5px dashed var(--border-dashed);
        }

        .stamp-col {
            display: flex;
            flex-direction: column;
        }

        .stamp-lbl {
            font-size: 0.62rem;
            color: #B0A09E;
        }

        .stamp-val {
            color: var(--text-dark);
            font-weight: bold;
        }

        .progress-candy-bg {
            height: 8px;
            background: #F3EAE0;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-candy-fill {
            height: 100%;
            background: linear-gradient(90deg, #FCD34D, #34D399);
            border-radius: 8px;
            transition: width 0.5s ease-out;
        }

        .empty-cute-box {
            grid-column: span 2;
            text-align: center;
            padding: 50px 10px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: var(--shadow-kawaii);
            border: 3px dashed var(--border-dashed);
            color: var(--text-sub);
        }

        .empty-mascot {
            font-size: 3rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="kawaii-workshop">
        <!-- Craft Header -->
        <header class="craft-header">
            <div class="header-left">
                <span class="mascot-icon">🐱</span>
                <div>
                    <h1 class="shop-name">星野手作</h1>
                    <p class="shop-slogan">✦ 萌趣时光小屋 ✦</p>
                </div>
            </div>
            <div class="hand-badge" id="cardCounter">0 份手作</div>
        </header>

        <!-- Cute Filter Tabs -->
        <nav class="tabs-pill-bar">
            <button type="button" class="tab-pill active" data-filter="all">✨ 全部手作</button>
            <button type="button" class="tab-pill" data-filter="running">🏃 制作中</button>
            <button type="button" class="tab-pill" data-filter="expired">⏰ 时间到啦</button>
        </nav>

        <!-- Dual Column Cards Grid -->
        <main class="card-grid" id="cardsGrid">
            <!-- Dynamic Cute Cards -->
        </main>
    </div>

    <script>
        let currentFilter = 'all';
        let cachedCardsData = [];

        const FIXED_GIST_ID = "6582c66b24bad75381f70abdae62e81b";
        const RAW_GIST_URL = `https://gist.githubusercontent.com/raw/${FIXED_GIST_ID}/cards_data.json`;

        document.addEventListener('DOMContentLoaded', () => {
            const tabPills = document.querySelectorAll('.tab-pill');
            tabPills.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabPills.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentFilter = target.getAttribute('data-filter') || 'all';
                    renderDashboard(cachedCardsData);
                });
            });

            fetchCardsFromGist();
            setInterval(fetchCardsFromGist, 5000); // Poll Gist every 5s
            setInterval(tickLocalTimers, 1000);     // Tick UI timer every 1s
        });

        async function fetchCardsFromGist() {
            try {
                const res = await fetch(`${RAW_GIST_URL}?t=${Date.now()}`);
                if (!res.ok) return;
                const fileContent = await res.text();

                if (fileContent) {
                    try {
                        cachedCardsData = JSON.parse(fileContent);
                    } catch (parseErr) {
                        cachedCardsData = [];
                    }
                    renderDashboard(cachedCardsData);
                }
            } catch (err) {
                console.error('Failed to fetch from Raw Gist CDN:', err);
            }
        }

        function tickLocalTimers() {
            if (cachedCardsData.length > 0) {
                renderDashboard(cachedCardsData);
            }
        }

        function computeCardsState(cards) {
            if (!Array.isArray(cards)) return [];
            const now = Date.now();

            return cards.map(c => {
                let remaining = c.savedRemainingSeconds || 0;
                let status = c.status; // 0: Stopped, 1: Running, 2: Paused, 3: Expired

                let startTimeStr = "--:--";
                let endTimeStr = "--:--";

                if (c.startTimeUtc) {
                    const startMs = new Date(c.startTimeUtc).getTime();
                    startTimeStr = formatClockTime(startMs);

                    if (c.targetDurationSeconds > 0) {
                        const endMs = startMs + (c.targetDurationSeconds * 1000);
                        endTimeStr = formatClockTime(endMs);
                    }

                    if (status === 1) {
                        const elapsed = (now - startMs) / 1000;
                        remaining = (c.savedRemainingSeconds || 0) - elapsed;
                        if (remaining <= 0) {
                            status = 3; // Expired
                        }
                    }
                }

                const isOverdue = remaining < 0 && (status === 1 || status === 3);
                const overdueSeconds = isOverdue ? Math.abs(remaining) : 0;

                return {
                    ...c,
                    status,
                    remainingSeconds: remaining,
                    overdueSeconds,
                    isOverdue,
                    startTimeStr,
                    endTimeStr
                };
            });
        }

        function formatClockTime(timestampMs) {
            if (!timestampMs || isNaN(timestampMs)) return "--:--";
            const date = new Date(timestampMs);
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function formatTime(totalSeconds) {
            const isNegative = totalSeconds < 0;
            const absSeconds = Math.abs(Math.floor(totalSeconds));
            
            const h = Math.floor(absSeconds / 3600);
            const m = Math.floor((absSeconds % 3600) / 60);
            const s = absSeconds % 60;

            const pad = n => n.toString().padStart(2, '0');
            let str = `${pad(m)}:${pad(s)}`;
            if (h > 0) str = `${pad(h)}:` + str;
            
            return isNegative ? `-${str}` : str;
        }

        function renderDashboard(rawCards) {
            const cards = computeCardsState(rawCards);

            document.getElementById('cardCounter').textContent = `${cards.length} 份手作`;

            const filtered = cards.filter(c => {
                if (currentFilter === 'running') return c.status === 1 && !c.isOverdue;
                if (currentFilter === 'expired') return c.isOverdue || c.status === 3;
                return true;
            });

            const grid = document.getElementById('cardsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-cute-box">
                        <div class="empty-mascot">🐾</div>
                        <p>暂无手作在此分类下哦~<br>快去手机端刷卡体验吧！✨</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(card => {
                let isExpiredMode = card.isOverdue || card.status === 3;
                let tagClass = 'tag-gray';
                let statusText = '🌸 准备中';
                let timeColorClass = '';

                if (isExpiredMode) {
                    tagClass = 'tag-rose';
                    statusText = '⏰ 时间到';
                    timeColorClass = 'text-rose';
                } else if (card.status === 1) {
                    tagClass = 'tag-mint';
                    statusText = '🏃 制作中';
                    timeColorClass = 'text-mint';
                } else if (card.status === 2) {
                    tagClass = 'tag-amber';
                    statusText = '🍵 憩息中';
                    timeColorClass = 'text-amber';
                }

                const remainingSec = card.remainingSeconds;
                const targetSec = card.targetDurationSeconds;
                let pct = 100;
                if (targetSec > 0) {
                    pct = Math.max(0, Math.min(100, (remainingSec / targetSec) * 100));
                }

                let timeHtml = '';
                if (isExpiredMode) {
                    timeHtml = `
                        <div class="clock-val-cute text-rose">00:00</div>
                        <div class="overdue-cute-banner">🚨 已超时 ${formatTime(card.overdueSeconds)}</div>
                    `;
                } else {
                    timeHtml = `
                        <div class="clock-val-cute ${timeColorClass}">
                            ${formatTime(remainingSec)}
                        </div>
                    `;
                }

                return `
                    <div class="cute-card ${isExpiredMode ? 'card-overdue-mode' : ''}">
                        <div>
                            <div class="card-head-bar">
                                <div class="card-name-title" title="${escapeHtml(card.name)}">${escapeHtml(card.name)}</div>
                                <span class="cute-tag ${tagClass}">${statusText}</span>
                            </div>
                            <div class="card-uid-sub">UID: ${escapeHtml(card.cardId)}</div>
                        </div>

                        <div class="time-box-center">
                            ${timeHtml}
                        </div>

                        <!-- Timeline Stamp -->
                        <div class="stamp-timeline">
                            <div class="stamp-col">
                                <span class="stamp-lbl">▶ 开始</span>
                                <span class="stamp-val">${card.startTimeStr}</span>
                            </div>
                            <div class="stamp-col" style="text-align: right;">
                                <span class="stamp-lbl">🏁 到期</span>
                                <span class="stamp-val">${card.endTimeStr}</span>
                            </div>
                        </div>

                        <div class="progress-candy-bg">
                            <div class="progress-candy-fill" style="width: ${isExpiredMode ? 0 : pct}%; ${card.status === 2 ? 'background: #FCD34D' : ''}"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
