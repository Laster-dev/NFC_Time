<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 星野手作 | 萌趣时光小屋 🐱</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=ZCOOL+KuaiLe&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Warm Creamy Craft Palette */
            --bg-page: #FFFDF9;
            --bg-card: #FFFFFF;
            --border-craft: #F4E8D6;
            --border-dashed: #E6D2B8;
            
            --text-dark: #4A3E3D;
            --text-sub: #9E8E8C;
            
            --color-cream-yellow: #FEF3C7;
            --color-cream-yellow-border: #FCD34D;
            --color-yellow-text: #D97706;
            
            --color-mint-soft: #D1FAE5;
            --color-mint-border: #6EE7B7;
            --color-mint-text: #059669;
            
            --color-rose-soft: #FFE4E6;
            --color-rose-border: #FDA4AF;
            --color-rose-text: #E11D48;

            --color-blue-soft: #E0F2FE;
            --color-blue-text: #0284C7;
            
            --shadow-kawaii: 0 6px 16px rgba(158, 142, 140, 0.08);
            --shadow-hover: 0 10px 24px rgba(158, 142, 140, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Ultra-Cute Round Fonts */
            font-family: 'M PLUS Rounded 1c', 'Comfortaa', 'ZCOOL KuaiLe', system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(#F3E5D8 1.5px, transparent 1.5px),
                radial-gradient(#F3E5D8 1.5px, #FFFDF9 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .kawaii-workshop {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Handmade Craft Header */
        .craft-header {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-kawaii);
            border: 2px dashed var(--border-dashed);
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mascot-icon {
            font-size: 2.2rem;
            animation: cute-wobble 3s ease-in-out infinite;
        }

        @keyframes cute-wobble {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg) scale(1.08); }
        }

        .shop-name {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-dark);
            line-height: 1.1;
            font-family: 'M PLUS Rounded 1c', 'ZCOOL KuaiLe', sans-serif;
        }

        .shop-slogan {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-top: 3px;
        }

        .hand-badge {
            background: var(--color-cream-yellow);
            border: 2px solid var(--color-cream-yellow-border);
            color: var(--color-yellow-text);
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        /* Announcement Section in Web (Normal non-force list) */
        .anno-board-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .anno-cute-card {
            background: #FFFFFF;
            border-radius: 10px;
            padding: 8px 12px;
            border: 1.5px solid #FCD34D;
            background: linear-gradient(180deg, #FFFFFF 0%, #FEFCE8 100%);
            box-shadow: var(--shadow-kawaii);
            position: relative;
        }

        .anno-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .anno-card-title {
            font-size: 0.95rem;
            font-weight: 900;
            color: #D97706;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .anno-card-time {
            font-size: 0.65rem;
            color: #9E8E8C;
            font-family: 'Comfortaa', sans-serif;
        }

        .anno-card-content {
            font-size: 0.82rem;
            color: var(--text-dark);
            line-height: 1.4;
            white-space: pre-wrap;
        }

        /* Forced Announcement Modal Overlay */
        .force-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(45, 35, 39, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .force-modal-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 360px;
            border-radius: 26px;
            padding: 22px 20px;
            border: 4px solid #FDA4AF;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
            animation: modal-bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modal-bounce {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .force-modal-header {
            font-size: 1.2rem;
            font-weight: 900;
            color: #E11D48;
        }

        .force-modal-body {
            font-size: 0.92rem;
            color: var(--text-dark);
            line-height: 1.5;
            background: #FFF1F2;
            padding: 14px;
            border-radius: 16px;
            border: 2px dashed #FECDD3;
            text-align: left;
            white-space: pre-wrap;
        }

        .force-close-btn {
            background: #E11D48;
            color: #FFFFFF;
            border: none;
            outline: none;
            padding: 12px 0;
            border-radius: 18px;
            font-size: 0.95rem;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
            transition: all 0.2s;
        }

        .force-close-btn:disabled {
            background: #9CA3AF;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Cute Tabs Filter */
        .tabs-pill-bar {
            display: flex;
            background: #FFFFFF;
            padding: 4px;
            border-radius: 10px;
            box-shadow: var(--shadow-kawaii);
            border: 2px solid var(--border-craft);
            gap: 4px;
        }

        .tab-pill {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-sub);
            padding: 6px 0;
            font-size: 0.82rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .tab-pill.active {
            background: #FFE4E6;
            color: #E11D48;
            border: 1.5px solid #FDA4AF;
            font-weight: 900;
        }

        /* Single Column Hand-crafted Card Grid */
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 30px;
        }

        .cute-card {
            background: #FFFFFF;
            border-radius: 22px;
            padding: 14px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            box-shadow: var(--shadow-kawaii);
            border: 3px solid var(--border-craft);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cute-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .cute-card.card-overdue-mode {
            border-color: var(--color-rose-border);
            background: linear-gradient(180deg, #FFFFFF 0%, #FFF5F5 100%);
            animation: soft-pulse 2s infinite alternate;
        }

        @keyframes soft-pulse {
            0% { border-color: #FDA4AF; }
            100% { border-color: #F43F5E; }
        }

        .card-head-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-name-title {
            font-size: 1.08rem;
            font-weight: 800;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }

        .cute-tag {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 800;
            border: 1.5px solid transparent;
        }

        .tag-mint { background: var(--color-mint-soft); border-color: var(--color-mint-border); color: var(--color-mint-text); }
        .tag-amber { background: var(--color-cream-yellow); border-color: var(--color-cream-yellow-border); color: var(--color-yellow-text); }
        .tag-gray { background: #F3F4F6; border-color: #E5E7EB; color: #6B7280; }
        .tag-rose { background: var(--color-rose-soft); border-color: var(--color-rose-border); color: var(--color-rose-text); }

        .card-uid-sub {
            font-size: 0.68rem;
            color: var(--text-sub);
            margin-top: 1px;
            font-family: 'Comfortaa', monospace;
            font-weight: 700;
        }

        .card-row-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-row-2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .clock-val-cute {
            font-size: 1.32rem;
            font-family: 'M PLUS Rounded 1c', 'Comfortaa', sans-serif;
            font-weight: 800;
            letter-spacing: -0.4px;
            line-height: 1.1;
            white-space: nowrap;
            display: inline-block;
        }

        .clock-val-cute.text-mint { color: var(--color-mint-text); }
        .clock-val-cute.text-amber { color: var(--color-yellow-text); }
        .clock-val-cute.text-rose { color: var(--color-rose-text); }

        .overdue-mini-alert {
            color: var(--color-rose-text);
            background: var(--color-rose-soft);
            border: 1px solid var(--color-rose-border);
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .progress-candy-bg {
            height: 3px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 1.5px;
            overflow: hidden;
            margin-top: 8px;
            margin-bottom: 2px;
        }

        .progress-candy-fill {
            height: 100%;
            background: #10B981;
            border-radius: 1.5px;
            transition: width 0.5s ease-out;
        }

        .empty-cute-box {
            grid-column: span 2;
            text-align: center;
            padding: 50px 10px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: var(--shadow-kawaii);
            border: 3px dashed var(--border-dashed);
            color: var(--text-sub);
        }

        .empty-mascot {
            font-size: 3rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="kawaii-workshop">
        <!-- Craft Header -->
        <header class="craft-header">
            <div class="header-left">
                <span class="mascot-icon">🐱</span>
                <div>
                    <h1 class="shop-name">星野手作</h1>
                    <p class="shop-slogan">✦ 萌趣时光小屋 ✦</p>
                </div>
            </div>
            <div class="hand-badge" id="cardCounter">0 份手作</div>
        </header>

        <!-- Announcement Board Container -->
        <div class="anno-board-area" id="annoBoardArea">
            <!-- Dynamic announcements -->
        </div>

        <!-- Cute Filter Tabs -->
        <nav class="tabs-pill-bar">
            <button type="button" class="tab-pill active" data-filter="all">✨ 全部手作</button>
            <button type="button" class="tab-pill" data-filter="running">🏃 制作中</button>
            <button type="button" class="tab-pill" data-filter="expired">⏰ 时间到啦</button>
        </nav>

        <!-- Dual Column Cards Grid -->
        <main class="card-grid" id="cardsGrid">
            <!-- Dynamic Cute Cards -->
        </main>
    </div>

    <!-- Forced Announcement Modal -->
    <div class="force-modal-overlay" id="forceAnnoModal" style="display: none;">
        <div class="force-modal-box">
            <div class="force-modal-header" id="forceModalTitle">📢 重要公告</div>
            <div class="force-modal-body" id="forceModalContent">...</div>
            <button type="button" class="force-close-btn" id="forceCloseBtn" disabled>阅读倒计时 (3s)</button>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let cachedCardsData = [];
        let cachedAnnouncements = [];
        let forceShownMap = new Set();

        const FIXED_GIST_ID = "6582c66b24bad75381f70abdae62e81b";
        
        // Pure CDN URLs
        const RAW_GIST_CARDS = `https://gist.githubusercontent.com/raw/${FIXED_GIST_ID}/cards_data.json`;
        const RAW_GIST_ANNOS = `https://gist.githubusercontent.com/raw/${FIXED_GIST_ID}/announcements.json`;

        document.addEventListener('DOMContentLoaded', () => {
            const tabPills = document.querySelectorAll('.tab-pill');
            tabPills.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabPills.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentFilter = target.getAttribute('data-filter') || 'all';
                    renderDashboard(cachedCardsData);
                });
            });

            fetchAllFromCDN();
            setInterval(fetchAllFromCDN, 4000);  // Poll Raw CDN every 4s
            setInterval(tickLocalTimers, 1000);   // Tick UI timer every 1s
        });

        async function fetchAllFromCDN() {
            try {
                const [cardsRes, annosRes] = await Promise.all([
                    fetch(`${RAW_GIST_CARDS}?t=${Date.now()}`).catch(() => null),
                    fetch(`${RAW_GIST_ANNOS}?t=${Date.now()}`).catch(() => null)
                ]);

                if (cardsRes && cardsRes.ok) {
                    const cardsText = await cardsRes.text();
                    if (cardsText) {
                        try { cachedCardsData = JSON.parse(cardsText); } catch (e) {}
                    }
                    renderDashboard(cachedCardsData);
                }

                if (annosRes && annosRes.ok) {
                    const annosText = await annosRes.text();
                    if (annosText) {
                        try { cachedAnnouncements = JSON.parse(annosText); } catch (e) {}
                    }
                    renderAnnouncements(cachedAnnouncements);
                }
            } catch (err) {
                console.error('Failed to fetch CDN data:', err);
            }
        }

        function renderAnnouncements(annos) {
            if (!Array.isArray(annos) || annos.length === 0) {
                document.getElementById('annoBoardArea').innerHTML = '';
                return;
            }

            const forcedAnnos = annos.filter(a => a.isForce);

            // Render ALL announcements on board
            const board = document.getElementById('annoBoardArea');
            board.innerHTML = annos.map(a => `
                <div class="anno-cute-card">
                    <div class="anno-card-head">
                        <span class="anno-card-title">${a.isForce ? '🚨 [重要提醒]' : '📢'} ${escapeHtml(a.title)}</span>
                        <span class="anno-card-time">${formatAnnoTime(a.publishTimeUtc)}</span>
                    </div>
                    <div class="anno-card-content">${escapeHtml(a.content)}</div>
                </div>
            `).join('');

            // Handle forced popup (Show latest forced announcement if not popped yet)
            if (forcedAnnos.length > 0) {
                const latestForce = forcedAnnos[0];
                if (!forceShownMap.has(latestForce.id)) {
                    showForceModal(latestForce);
                }
            }
        }

        function showForceModal(anno) {
            forceShownMap.add(anno.id);
            const modal = document.getElementById('forceAnnoModal');
            const titleEl = document.getElementById('forceModalTitle');
            const contentEl = document.getElementById('forceModalContent');
            const btn = document.getElementById('forceCloseBtn');

            titleEl.textContent = `📢 ${anno.title}`;
            contentEl.textContent = anno.content;
            btn.disabled = true;

            modal.style.display = 'flex';

            let count = 3;
            btn.textContent = `阅读倒计时 (${count}s)`;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    btn.textContent = `阅读倒计时 (${count}s)`;
                } else {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = `知晓并关闭`;
                    btn.onclick = () => {
                        modal.style.display = 'none';
                    };
                }
            }, 1000);
        }

        function formatAnnoTime(utcStr) {
            if (!utcStr) return '';
            const date = new Date(utcStr);
            if (isNaN(date.getTime())) return utcStr;
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function tickLocalTimers() {
            if (cachedCardsData.length > 0) {
                renderDashboard(cachedCardsData);
            }
        }

        function computeCardsState(cards) {
            if (!Array.isArray(cards)) return [];
            const now = Date.now();

            return cards.map(c => {
                let remaining = c.savedRemainingSeconds || 0;
                let status = c.status; // 0: Unused/Stopped, 1: Running, 2: Paused, 3: Expired

                let startTimeStr = "--:--";
                let endTimeStr = "--:--";

                if (c.startTimeUtc) {
                    const startMs = new Date(c.startTimeUtc).getTime();
                    startTimeStr = formatClockTime(startMs);

                    if (c.targetDurationSeconds > 0) {
                        const endMs = startMs + (c.targetDurationSeconds * 1000);
                        endTimeStr = formatClockTime(endMs);
                    }

                    if (status === 1) {
                        const elapsed = (now - startMs) / 1000;
                        remaining = (c.savedRemainingSeconds || 0) - elapsed;
                        if (remaining <= 0) {
                            status = 3; // Expired
                        }
                    }
                }

                const isOverdue = remaining < 0 && (status === 1 || status === 3);
                const overdueSeconds = isOverdue ? Math.abs(remaining) : 0;

                return {
                    ...c,
                    status,
                    remainingSeconds: remaining,
                    overdueSeconds,
                    isOverdue,
                    startTimeStr,
                    endTimeStr
                };
            });
        }

        function formatClockTime(timestampMs) {
            if (!timestampMs || isNaN(timestampMs)) return "--:--";
            const date = new Date(timestampMs);
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function formatTime(totalSeconds) {
            const isNegative = totalSeconds < 0;
            const absSeconds = Math.abs(Math.floor(totalSeconds));
            
            const h = Math.floor(absSeconds / 3600);
            const m = Math.floor((absSeconds % 3600) / 60);
            const s = absSeconds % 60;

            let parts = [];
            if (h > 0) parts.push(`${h}小时`);
            if (m > 0 || h > 0) parts.push(`${m}分钟`);
            parts.push(`${s}秒`);
            let str = parts.join('');
            
            return isNegative ? `-${str}` : str;
        }

        function renderDashboard(rawCards) {
            const allCards = computeCardsState(rawCards);

            // Filter out status === 0 (Unused cards) from Web display
            const activeWebCards = allCards.filter(c => c.status !== 0);

            document.getElementById('cardCounter').textContent = `${activeWebCards.length} 份手作`;

            const filtered = activeWebCards.filter(c => {
                if (currentFilter === 'running') return c.status === 1 && !c.isOverdue;
                if (currentFilter === 'expired') return c.isOverdue || c.status === 3;
                return true;
            });

            // Sort: Overdue cards first!
            filtered.sort((a, b) => {
                const aOverdue = a.isOverdue || a.status === 3;
                const bOverdue = b.isOverdue || b.status === 3;
                if (aOverdue && !bOverdue) return -1;
                if (!aOverdue && bOverdue) return 1;
                if (a.status === 1 && b.status !== 1) return -1;
                if (a.status !== 1 && b.status === 1) return 1;
                return a.cardId.localeCompare(b.cardId);
            });

            const grid = document.getElementById('cardsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-cute-box">
                        <div class="empty-mascot">🐾</div>
                        <p>暂无制作中的手作哦~<br>快去手机端刷卡开始吧！✨</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(card => {
                let isExpiredMode = card.isOverdue || card.status === 3;
                let tagClass = 'tag-gray';
                let statusText = '🌸 准备中';
                let timeColorClass = '';

                if (isExpiredMode) {
                    tagClass = 'tag-rose';
                    statusText = '⏰ 时间到';
                    timeColorClass = 'text-rose';
                } else if (card.status === 1) {
                    tagClass = 'tag-mint';
                    statusText = '🏃 制作中';
                    timeColorClass = 'text-mint';
                } else if (card.status === 2) {
                    tagClass = 'tag-amber';
                    statusText = '🍵 憩息中';
                    timeColorClass = 'text-amber';
                }

                const remainingSec = card.remainingSeconds;
                const targetSec = card.targetDurationSeconds;
                let pct = 100;
                if (targetSec > 0) {
                    pct = Math.max(0, Math.min(100, (remainingSec / targetSec) * 100));
                }

                return `
                    <div class="cute-card ${isExpiredMode ? 'card-overdue-mode' : ''}">
                        <!-- Row 1: Title + Tag on Left, Timer on Right -->
                        <div class="card-row-1">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="card-name-title" title="${escapeHtml(card.name)}">${escapeHtml(card.name)}</span>
                                <span class="cute-tag ${tagClass}">${statusText}</span>
                            </div>
                            <div class="clock-val-cute ${timeColorClass}">
                                ${isExpiredMode ? '0秒' : formatTime(remainingSec)}
                            </div>
                        </div>

                        <!-- Row 2: UID on Left, Timestamps + Overdue Mini Alert on Right -->
                        <div class="card-row-2">
                            <span class="card-uid-sub">UID: ${escapeHtml(card.cardId)}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="stamp-val-text">${card.startTimeStr} → ${card.endTimeStr}</span>
                                ${isExpiredMode ? `<span class="overdue-mini-alert">🚨 超时 ${formatTime(card.overdueSeconds)}</span>` : ''}
                            </div>
                        </div>

                        <!-- Progress Bar at bottom -->
                        <div class="progress-candy-bg">
                            <div class="progress-candy-fill" style="width: ${isExpiredMode ? 0 : pct}%; ${card.status === 2 ? 'background: #FCD34D' : ''}"></div>
                        </div>
                    </div>
                `;
            }).join('');

            // Dynamically adjust font size to prevent overflow or wrapping
            document.querySelectorAll('.clock-val-cute').forEach(el => {
                adjustFontSize(el);
            });
        }

        function adjustFontSize(element) {
            let fontSize = 1.32; // Start size in rem (aligned with CSS)
            element.style.fontSize = fontSize + 'rem';
            const parent = element.parentElement;
            if (!parent) return;
            const maxAllowedWidth = parent.clientWidth - 12; // 6px safety padding on each side
            while (element.scrollWidth > maxAllowedWidth && fontSize > 0.7) {
                fontSize -= 0.05;
                element.style.fontSize = fontSize.toFixed(2) + 'rem';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
