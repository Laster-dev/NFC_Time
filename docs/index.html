<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC 刷卡计时监控</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-app">
        <!-- Header Zone -->
        <header class="header">
            <div class="brand-group">
                <span class="brand-logo">⏱️</span>
                <div>
                    <h1 class="brand-title">NFC 刷卡计时中心</h1>
                    <p class="brand-subtitle">GitHub 云端实时感知</p>
                </div>
            </div>
            <div class="live-pill">
                <span class="live-dot"></span>
                <span id="cardCounter">0 张卡片</span>
            </div>
        </header>

        <!-- Stats Overview Cards -->
        <div class="stats-scroll">
            <div class="stat-pill stat-running">
                <span class="stat-num" id="countRunning">0</span>
                <span class="stat-label">运行中</span>
            </div>
            <div class="stat-pill stat-paused">
                <span class="stat-num" id="countPaused">0</span>
                <span class="stat-label">已暂停</span>
            </div>
            <div class="stat-pill stat-stopped">
                <span class="stat-num" id="countStopped">0</span>
                <span class="stat-label">未开始</span>
            </div>
            <div class="stat-pill stat-expired">
                <span class="stat-num" id="countExpired">0</span>
                <span class="stat-label">已超时</span>
            </div>
        </div>

        <!-- Filter Segmented Control -->
        <div class="segment-control">
            <button class="segment-btn active" data-filter="all">全部</button>
            <button class="segment-btn" data-filter="running">运行中</button>
            <button class="segment-btn" data-filter="expired">超时</button>
        </div>

        <!-- Card Stream List -->
        <main class="card-stream" id="cardsGrid">
            <!-- Dynamic Mobile Cards -->
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
