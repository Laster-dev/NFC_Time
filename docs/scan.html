<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星野手作 | 扫码开启萌趣时光 🐱</title>
    <!-- Disable cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=ZCOOL+KuaiLe&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #FFF5F5;
            --bg-container: #FFFFFF;
            --border-cute: #FFCCD5;
            --border-shadow: #FFE4E6;
            --text-dark: #5C4B49;
            --text-sub: #A89593;
            --pink-accent: #FFE4E6;
            --pink-text: #FF5A79;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Comfortaa', sans-serif;
            background: linear-gradient(135deg, #FFF5F5 0%, #FFFDF9 50%, #FFF9E6 100%);
            background-image: radial-gradient(#FFCCD5 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating decoration particles (hidden during print) */
        .decor {
            position: absolute;
            font-size: 2rem;
            opacity: 0.4;
            user-select: none;
            pointer-events: none;
            animation: float-slow 6s ease-in-out infinite alternate;
        }
        .decor-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .decor-2 { top: 75%; left: 8%; animation-delay: 1.5s; }
        .decor-3 { top: 20%; right: 10%; animation-delay: 0.8s; }
        .decor-4 { top: 80%; right: 12%; animation-delay: 2s; }
        .decor-5 { top: 45%; left: 85%; animation-delay: 1.2s; }

        /* A4 Page Dimensions (ratio 1:1.414) */
        .poster-container {
            width: 210mm;
            height: 297mm;
            background: var(--bg-container);
            border-radius: 40px;
            border: 10px solid var(--border-cute);
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.2);
            padding: 60px 45px 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Top ribbon decoration */
        .poster-ribbon {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #FF5A79;
            border: 3px solid #FF5A79;
            padding: 8px 36px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 1.25rem;
            color: #FFFFFF;
            box-shadow: 0 4px 0 #FFCCD5;
        }

        .header {
            margin-top: 10px;
            width: 100%;
            text-align: center;
        }

        .shop-name {
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 3.2rem;
            color: var(--pink-text);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 3px 3px 0px #FFE4E6;
        }

        .shop-slogan {
            font-size: 1.15rem;
            color: var(--text-sub);
            font-weight: 800;
            letter-spacing: 1.5px;
            display: inline-block;
            background: #FFF9E6;
            padding: 6px 20px;
            border-radius: 16px;
            border: 2px dashed #FCD34D;
        }

        /* Cute Cat Ears QR Frame */
        .qr-section {
            display: inline-block;
            background: #FFFFFF;
            padding: 24px;
            border-radius: 40px;
            border: 6px solid var(--border-cute);
            box-shadow: 0 12px 0 var(--border-shadow);
            position: relative;
            animation: float-bubble 4s ease-in-out infinite;
        }

        /* Cat Ears */
        .qr-section::before, .qr-section::after {
            content: '';
            position: absolute;
            top: -24px;
            width: 52px;
            height: 52px;
            background: var(--border-cute);
            border-radius: 18px;
            z-index: -1;
        }
        .qr-section::before {
            left: 30px;
            transform: rotate(-15deg);
        }
        .qr-section::after {
            right: 30px;
            transform: rotate(15deg);
        }

        /* Cat Inner Ears */
        .qr-inner-ear-l, .qr-inner-ear-r {
            position: absolute;
            top: -15px;
            width: 28px;
            height: 28px;
            background: #FF8E9F;
            border-radius: 10px;
            z-index: -1;
        }
        .qr-inner-ear-l {
            left: 42px;
            transform: rotate(-15deg);
        }
        .qr-inner-ear-r {
            right: 42px;
            transform: rotate(15deg);
        }

        .qr-image {
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFFFFF;
            overflow: hidden;
            border-radius: 20px;
        }

        .qr-image img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 20px;
        }

        .scan-arrow {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: #FF5A79;
            border: 3px solid #FFFFFF;
            padding: 6px 24px;
            border-radius: 20px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            color: #FFFFFF;
            white-space: nowrap;
            box-shadow: 0 6px 12px rgba(255, 90, 121, 0.3);
        }

        /* Features List */
        .features-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
            width: 100%;
        }

        .feature-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 24px;
            border-radius: 24px;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-width: 3px;
            border-style: solid;
        }

        .feature-card:hover {
            transform: scale(1.02);
        }

        .feature-card.f-timer {
            background: #F0FDF4;
            border-color: #BBF7D0;
        }
        .feature-card.f-music {
            background: #EFF6FF;
            border-color: #BFDBFE;
        }
        .feature-card.f-led {
            background: #FFF1F2;
            border-color: #FECDD3;
        }

        .feature-icon {
            font-size: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: #FFFFFF;
            border-radius: 18px;
            border: 2px solid;
        }

        .f-timer .feature-icon { border-color: #BBF7D0; }
        .f-music .feature-icon { border-color: #BFDBFE; }
        .f-led .feature-icon { border-color: #FECDD3; }

        .feature-info {
            flex: 1;
        }

        .feature-title {
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 1.4rem;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.5;
            font-weight: 800;
        }

        /* Footer stamp */
        .footer-mascot {
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 1.25rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        /* Animations */
        @keyframes float-bubble {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(0.5deg); }
        }

        @keyframes float-slow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-12px) rotate(10deg); }
        }

        @keyframes cute-wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-5deg) scale(1.05); }
            75% { transform: rotate(5deg) scale(1.05); }
        }

        /* CSS Print Styles for A4 Poster */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body {
                background: #FFFFFF;
                padding: 0;
                margin: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .decor {
                display: none;
            }
            .poster-container {
                width: 210mm;
                height: 297mm;
                border-radius: 0;
                border: 12px solid var(--border-cute);
                box-shadow: none;
                padding: 60px 45px 50px 45px;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <!-- Background Floating Emojis -->
    <div class="decor decor-1">🐱</div>
    <div class="decor decor-2">🌸</div>
    <div class="decor decor-3">✨</div>
    <div class="decor decor-4">🐾</div>
    <div class="decor decor-5">🎵</div>

    <div class="poster-container">
        <!-- Cute Ribbon -->
        <div class="poster-ribbon">🏡 欢迎光临时光小屋</div>

        <!-- Header -->
        <header class="header">
            <h1 class="shop-name">星野手作 <span style="animation: cute-wobble 2.5s infinite; display: inline-block;">🐱</span></h1>
            <p class="shop-slogan">✦ 微信扫一扫 · 开启趣味互动 ✦</p>
        </header>

        <!-- QR Code with Cat Ears -->
        <div class="qr-section">
            <div class="qr-inner-ear-l"></div>
            <div class="qr-inner-ear-r"></div>
            <!-- Container for local JS QR Code generator -->
            <div id="qrcode" class="qr-image"></div>
            <div class="scan-arrow">🐾 喵！扫我开启 🐾</div>
        </div>

        <!-- Feature Cards -->
        <div class="features-grid">
            <!-- Feature 1: Timer -->
            <div class="feature-card f-timer">
                <div class="feature-icon">⏱️</div>
                <div class="feature-info">
                    <h3 class="feature-title">实时查看剩余时间</h3>
                    <p class="feature-desc">刷卡上报后，扫码随时跟进你的手作剩余时间和超时预警。</p>
                </div>
            </div>

            <!-- Feature 2: Music -->
            <div class="feature-card f-music">
                <div class="feature-icon">🎵</div>
                <div class="feature-info">
                    <h3 class="feature-title">萌趣现场点歌</h3>
                    <p class="feature-desc">想听什么歌？用手机轻轻一点，立刻为制作间换上温馨旋律。</p>
                </div>
            </div>

            <!-- Feature 3: LED PixDou -->
            <div class="feature-card f-led">
                <div class="feature-icon">📟</div>
                <div class="feature-info">
                    <h3 class="feature-title">智能豆板下载</h3>
                    <p class="feature-desc">一键扫码获取官方客户端，定制在屏幕上跳动的个性画作。</p>
                </div>
            </div>
        </div>

        <!-- Footer Mascot Stamp -->
        <div class="footer-mascot">
            <span>🐾</span>
            <span>星野手作 · 陪伴暖心每一天</span>
            <span>🐾</span>
        </div>
    </div>

    <!-- Include highly stable 360-baomitu CDN for offline client-side QR generation -->
    <script src="https://lib.baomitu.com/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Generate QR Code completely client-side to prevent network failures or blocks
            new QRCode(document.getElementById("qrcode"), {
                text: "https://laster-dev.github.io/NFC_Time/",
                width: 250,
                height: 250,
                colorDark : "#5C4B49", // Perfectly matching text-dark color (more premium than solid black!)
                colorLight : "#FFFFFF",
                correctLevel : QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
